<!DOCTYPE html>
<html lang="en" data-theme="dark" data-style="ios-glass">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Minimal Music Player</title>

  <link rel="manifest" id="manifest-placeholder" />
  <meta name="theme-color" content="#0b0b0d" id="theme-color-meta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <style>
    :root {
      --bg: #0d0e12;
      --card-bg: rgba(28, 28, 35, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --subtext: #a0a0ab;
      --accent: #ffffff;
      --glass-btn: rgba(255, 255, 255, 0.1);
      --glass-btn-hover: rgba(255, 255, 255, 0.2);
      --radius-card: 32px;
      --radius-art: 20px;
    }

    [data-theme="light"] {
      --bg: #eef0f5;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --text: #121316;
      --subtext: #6e707a;
      --accent: #121316;
      --glass-btn: rgba(0, 0, 0, 0.05);
      --glass-btn-hover: rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.3s ease, color 0.3s ease;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 10;
    }

    .glass-btn {
      background: var(--glass-btn);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      width: 42px;
      height: 42px;
      font-size: 18px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .glass-btn:active { transform: scale(0.9); background: var(--glass-btn-hover); }

    /* Main Container */
    .main-player {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      touch-action: pan-y;
    }

    /* Dynamic Player Styles */
    .player-card {
      width: 100%;
      max-width: 340px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-card);
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    /* Template 1: iOS Glass (Image 1 & 3) */
    [data-style="ios-glass"] .player-card {
      padding: 20px;
    }
    [data-style="ios-glass"] .album-frame {
      width: 100%;
      aspect-ratio: 1;
      border-radius: var(--radius-art);
      overflow: hidden;
      margin-bottom: 16px;
      background: rgba(0,0,0,0.2);
    }

    /* Template 2: Minimal Dark Card (Image 2) */
    [data-style="minimal-dark"] .player-card {
      background: #000000;
      border: 1px solid #1a1a1a;
      border-radius: 36px;
    }
    [data-style="minimal-dark"] .album-frame {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 24px;
      background: #121212;
      margin-bottom: 20px;
    }

    /* Template 3: Spotify Modern (Image 4) */
    [data-style="spotify"] .player-card {
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
    }
    [data-style="spotify"] .album-frame {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    /* Template 4: Classic Minimal */
    [data-style="classic"] .player-card {
      background: transparent;
      border: none;
      box-shadow: none;
      align-items: center;
    }
    [data-style="classic"] .album-frame {
      width: 260px;
      height: 260px;
      border-radius: 28px;
      border: 2px solid var(--card-border);
      margin-bottom: 20px;
    }

    .album-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .quote-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0,0,0,0.15));
    }

    .quote-text {
      font-size: 14px;
      font-weight: 600;
      font-style: italic;
      line-height: 1.4;
    }

    .track-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .source-label {
      font-size: 11px;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .track-title { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 13px; color: var(--subtext); margin-top: 2px; }

    /* Progress & Sliders */
    .progress-box { margin-bottom: 14px; }
    .progress-bar {
      width: 100%;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.15);
      outline: none;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--subtext);
      margin-top: 6px;
    }

    /* Player Controls */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      opacity: 0.8;
      transition: transform 0.15s ease;
    }

    .ctrl-btn:active { transform: scale(0.85); }

    .play-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--text);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .output-pill {
      align-self: center;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--card-border);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    /* Soundbars Visualizer */
    .soundbars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 20px;
      justify-content: center;
      margin-top: 8px;
    }

    .bar {
      width: 3px;
      background: var(--text);
      height: 4px;
      border-radius: 2px;
      transition: height 0.1s ease;
    }

    .soundbars.playing .bar {
      animation: pulse 0.6s infinite alternate ease-in-out;
    }
    .soundbars.playing .bar:nth-child(2n) { animation-delay: 0.2s; }
    .soundbars.playing .bar:nth-child(3n) { animation-delay: 0.4s; }

    @keyframes pulse { 0% { height: 4px; } 100% { height: 20px; } }

    /* Left Drawer (Library) & Right Drawer (Settings) */
    .drawer {
      position: fixed;
      top: 0;
      width: 80%;
      max-width: 320px;
      height: 100%;
      background: var(--bg);
      border-color: var(--card-border);
      z-index: 100;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .drawer-left { left: -100%; border-right: 1px solid var(--card-border); }
    .drawer-left.open { left: 0; }

    .drawer-right { right: -100%; border-left: 1px solid var(--card-border); }
    .drawer-right.open { right: 0; }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 90;
      display: none;
    }
    .drawer-overlay.open { display: block; }

    /* Library Grouping Styles */
    .nav-tabs { display: flex; gap: 8px; margin: 16px 0; }
    .tab-btn {
      background: var(--glass-btn);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 12px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--text); color: var(--bg); }

    .list-container { flex: 1; overflow-y: auto; }
    .group-header {
      font-size: 14px;
      font-weight: 700;
      padding: 10px 0 4px 0;
      color: var(--text);
      border-bottom: 1px solid var(--card-border);
    }
    .list-item {
      padding: 10px 0 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
    }

    /* Settings Options */
    .setting-group { margin-top: 20px; }
    .setting-label { font-size: 12px; color: var(--subtext); margin-bottom: 8px; text-transform: uppercase; }
    .option-select {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      background: var(--glass-btn);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
    }

    #folder-input { display: none; }
  </style>
</head>
<body>

  <!-- Top Header Controls -->
  <header>
    <button class="glass-btn" onclick="toggleDrawer('left')" aria-label="Library">☰</button>
    <div style="display: flex; gap: 10px;">
      <button class="glass-btn" onclick="document.getElementById('folder-input').click()" aria-label="Open Folder">📁</button>
      <button class="glass-btn" onclick="toggleDrawer('right')" aria-label="Settings">⚙</button>
    </div>
  </header>

  <!-- Main Player View -->
  <main class="main-player" id="swipe-area">
    <div class="player-card">
      <div class="album-frame">
        <img id="player-art" class="album-art" alt="Cover" />
        <div id="quote-container" class="quote-box">
          <div class="quote-text" id="quote-text">"Where words fail, music speaks."</div>
        </div>
      </div>

      <div class="track-info">
        <div style="overflow: hidden; padding-right: 8px;">
          <div class="source-label" id="source-label">iPhone</div>
          <div class="track-title" id="player-title">No Track Loaded</div>
          <div class="track-artist" id="player-artist">Tap 📁 to load music</div>
        </div>
        <button class="ctrl-btn" id="fav-btn" onclick="toggleFav()">☆</button>
      </div>

      <div class="progress-box">
        <input type="range" class="progress-bar" id="seek-bar" value="0" max="100" />
        <div class="time-row">
          <span id="time-curr">0:00</span>
          <span id="time-dur">-0:00</span>
        </div>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn" id="shuffle-btn" onclick="toggleShuffle()">🔀</button>
        <button class="ctrl-btn" onclick="playPrev()">⏮</button>
        <button class="ctrl-btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" onclick="playNext()">⏭</button>
        <button class="ctrl-btn" id="repeat-btn" onclick="toggleRepeat()">🔁</button>
      </div>

      <div class="output-pill" id="output-pill">
        <span>🎧</span> <span id="output-text">AirPods Pro</span>
      </div>

      <div class="soundbars" id="soundbars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
    </div>
  </main>

  <!-- Left Library Drawer -->
  <div class="drawer-overlay" id="overlay" onclick="closeDrawers()"></div>
  <div class="drawer drawer-left" id="drawer-left">
    <h2>Library</h2>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="renderView('songs', this)">Songs</button>
      <button class="tab-btn" onclick="renderView('albums', this)">Albums</button>
      <button class="tab-btn" onclick="renderView('artists', this)">Artists</button>
    </div>
    <div class="list-container" id="list-container">
      <div style="font-size:12px; color:var(--subtext); padding-top:10px;">No offline songs saved yet.</div>
    </div>
  </div>

  <!-- Right Settings Drawer -->
  <div class="drawer drawer-right" id="drawer-right">
    <h2>Settings</h2>
    
    <div class="setting-group">
      <div class="setting-label">Appearance Theme</div>
      <select class="option-select" onchange="setTheme(this.value)">
        <option value="dark">Dark Theme</option>
        <option value="light">Light Theme</option>
      </select>
    </div>

    <div class="setting-group">
      <div class="setting-label">Player Template Style</div>
      <select class="option-select" onchange="setStyle(this.value)">
        <option value="ios-glass">iOS Glass Card (Image 1 & 3)</option>
        <option value="minimal-dark">Minimal Dark Card (Image 2)</option>
        <option value="spotify">Spotify Modern (Image 4)</option>
        <option value="classic">Classic Minimal</option>
      </select>
    </div>
  </div>

  <input type="file" id="folder-input" webkitdirectory directory multiple accept="audio/*" />
  <audio id="audio-player"></audio>

  <script>
    const quotes = [
      "\"Where words fail, music speaks.\"",
      "\"One good thing about music, when it hits you, you feel no pain.\"",
      "\"Turn your passion into power.\"",
      "\"Music cleanses the soul from everyday life.\"",
      "\"Stay hungry, stay foolish.\""
    ];

    let playlist = [];
    let currentIndex = -1;
    let isShuffle = false;
    let isRepeat = false;

    const audio = document.getElementById('audio-player');
    const seekBar = document.getElementById('seek-bar');
    const soundbars = document.getElementById('soundbars');

    // Register Service Worker for Full Offline Capability
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // --- IndexedDB Local Track Caching ---
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('MusicStorageDB', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('tracks', { keyPath: 'id' });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveTrackToDB(track) {
      const db = await openDB();
      const tx = db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').put(track);
    }

    async function loadStoredTracks() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('tracks', 'readonly');
        const req = tx.objectStore('tracks').getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const saved = await loadStoredTracks();
      if (saved.length > 0) {
        playlist = saved.map(t => ({ ...t, url: URL.createObjectURL(t.blob) }));
        renderView('songs');
        loadTrack(0, false);
      }
    });

    document.getElementById('folder-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('audio/'));
      if (!files.length) return;

      playlist = [];
      for (let file of files) {
        const trackObj = {
          id: file.name + "_" + file.size,
          title: file.name.replace(/\.[^/.]+$/, ""),
          artist: "Unknown Artist",
          album: "Unknown Album",
          blob: file,
          art: null
        };

        // Extract ID3 Tags if jsmediatags is present
        if (window.jsmediatags) {
          window.jsmediatags.read(file, {
            onSuccess: function(tag) {
              if (tag.tags.title) trackObj.title = tag.tags.title;
              if (tag.tags.artist) trackObj.artist = tag.tags.artist;
              if (tag.tags.album) trackObj.album = tag.tags.album;
              if (tag.tags.picture) {
                const { data, format } = tag.tags.picture;
                let base64String = "";
                for (let i = 0; i < data.length; i++) {
                  base64String += String.fromCharCode(data[i]);
                }
                trackObj.art = `data:${format};base64,${window.btoa(base64String)}`;
              }
            }
          });
        }

        await saveTrackToDB(trackObj);
        trackObj.url = URL.createObjectURL(file);
        playlist.push(trackObj);
      }
      renderView('songs');
      if (playlist.length) loadTrack(0, false);
    });

    // --- Navigation & Settings ---
    function toggleDrawer(side) {
      closeDrawers();
      document.getElementById(`drawer-${side}`).classList.add('open');
      document.getElementById('overlay').classList.add('open');
    }

    function closeDrawers() {
      document.querySelectorAll('.drawer').forEach(d => d.classList.remove('open'));
      document.getElementById('overlay').classList.remove('open');
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
    }

    function setStyle(style) {
      document.documentElement.setAttribute('data-style', style);
    }

    function toggleFav() {
      const btn = document.getElementById('fav-btn');
      btn.innerText = btn.innerText === '☆' ? '★' : '☆';
    }

    // --- Library Views (Divided by Songs, Albums, Artists) ---
    function renderView(type, btn) {
      if (btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }

      const container = document.getElementById('list-container');
      if (!playlist.length) return;

      if (type === 'songs') {
        container.innerHTML = playlist.map((t, i) => `
          <div class="list-item" onclick="loadTrack(${i}); closeDrawers();">
            <div style="font-weight:600; font-size:14px;">${t.title}</div>
            <div style="font-size:12px; color:var(--subtext);">${t.artist}</div>
          </div>
        `).join('');
      } else {
        const key = type === 'albums' ? 'album' : 'artist';
        const groups = {};
        playlist.forEach((t, idx) => {
          const name = t[key] || `Unknown ${key}`;
          if (!groups[name]) groups[name] = [];
          groups[name].push({ ...t, originalIndex: idx });
        });

        container.innerHTML = Object.keys(groups).map(groupName => `
          <div class="group-header">${groupName} (${groups[groupName].length})</div>
          ${groups[groupName].map(t => `
            <div class="list-item" onclick="loadTrack(${t.originalIndex}); closeDrawers();">
              <div style="font-weight:600; font-size:13px;">${t.title}</div>
            </div>
          `).join('')}
        `).join('');
      }
    }

    // Swipe Support
    let touchStartX = 0;
    const swipeArea = document.getElementById('swipe-area');
    swipeArea.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
    swipeArea.addEventListener('touchend', e => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) playNext();
      if (touchEndX > touchStartX + 50) playPrev();
    });

    // --- Audio Playback ---
    function loadTrack(index, autoPlay = true) {
      currentIndex = index;
      const track = playlist[currentIndex];
      audio.src = track.url;
      document.getElementById('player-title').innerText = track.title;
      document.getElementById('player-artist').innerText = track.artist;

      const artImg = document.getElementById('player-art');
      const quoteBox = document.getElementById('quote-container');

      if (track.art) {
        artImg.src = track.art;
        artImg.style.display = 'block';
        quoteBox.style.display = 'none';
      } else {
        artImg.style.display = 'none';
        quoteBox.style.display = 'flex';
        document.getElementById('quote-text').innerText = quotes[Math.floor(Math.random() * quotes.length)];
      }

      if (autoPlay) {
        audio.play();
        document.getElementById('play-btn').innerText = '⏸';
        soundbars.classList.add('playing');
      }
    }

    function togglePlay() {
      if (currentIndex === -1 && playlist.length) loadTrack(0);
      if (audio.paused) {
        audio.play();
        document.getElementById('play-btn').innerText = '⏸';
        soundbars.classList.add('playing');
      } else {
        audio.pause();
        document.getElementById('play-btn').innerText = '▶';
        soundbars.classList.remove('playing');
      }
    }

    function playNext() {
      if (!playlist.length) return;
      currentIndex = isShuffle ? Math.floor(Math.random() * playlist.length) : (currentIndex + 1) % playlist.length;
      loadTrack(currentIndex);
    }

    function playPrev() {
      if (!playlist.length) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex);
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      document.getElementById('shuffle-btn').style.opacity = isShuffle ? "1" : "0.4";
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      document.getElementById('repeat-btn').style.opacity = isRepeat ? "1" : "0.4";
    }

    audio.addEventListener('ended', () => {
      if (isRepeat) { audio.currentTime = 0; audio.play(); }
      else playNext();
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        document.getElementById('time-curr').innerText = formatTime(audio.currentTime);
        document.getElementById('time-dur').innerText = "-" + formatTime(audio.duration - audio.currentTime);
      }
    });

    seekBar.addEventListener('input', () => {
      if (audio.duration) audio.currentTime = (seekBar.value / 100) * audio.duration;
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
  </script>
</body>
</html>
