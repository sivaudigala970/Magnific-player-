<!DOCTYPE html>
<html lang="en" data-theme="dark" data-style="ios-glass" data-accent="purple">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Magnific Music Player</title>

  <!-- Restore saved appearance before first paint, to avoid a flash of defaults.
       Also guards against a stored style that no longer exists (e.g. removed templates). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mp_theme');
        var s = localStorage.getItem('mp_style');
        var a = localStorage.getItem('mp_accent');
        var validStyles = ['ios-glass', 'minimal-dark', 'spotify', 'sunset'];
        if (t) document.documentElement.setAttribute('data-theme', t);
        if (s && validStyles.indexOf(s) !== -1) document.documentElement.setAttribute('data-style', s);
        if (a) document.documentElement.setAttribute('data-accent', a);
      } catch (e) {}
    })();
  </script>

  <link rel="manifest" id="manifest-placeholder" />
  <meta name="theme-color" content="#0a0b0e" id="theme-color-meta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Everything below runs from this one file — no external scripts, fonts, or images,
       so the app works with no network connection at all, from the very first load. -->

  <style>
    :root {
      --bg: #0a0b0e;
      --card-bg: rgba(22, 24, 30, 0.82);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --subtext: #9a9ab0;
      --glass-btn: rgba(255, 255, 255, 0.08);
      --glass-btn-hover: rgba(255, 255, 255, 0.16);

      --accent-purple: #8b5cf6;
      --accent-crimson: #ff3b5c;
      --accent-emerald: #10b981;
      --accent-gold: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent: var(--accent-purple);

      --radius-card: 32px;
      --radius-art: 22px;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

      --neu-dark: rgba(0, 0, 0, 0.55);
      --neu-light: rgba(255, 255, 255, 0.05);
    }

    [data-theme="light"] {
      --bg: #eef1f6;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(0, 0, 0, 0.08);
      --text: #111215;
      --subtext: #686b75;
      --glass-btn: rgba(0, 0, 0, 0.05);
      --glass-btn-hover: rgba(0, 0, 0, 0.12);
      --neu-dark: rgba(163, 177, 198, 0.55);
      --neu-light: rgba(255, 255, 255, 0.9);
    }

    [data-accent="purple"] { --accent: var(--accent-purple); }
    [data-accent="crimson"] { --accent: var(--accent-crimson); }
    [data-accent="emerald"] { --accent: var(--accent-emerald); }
    [data-accent="gold"] { --accent: var(--accent-gold); }
    [data-accent="cyan"] { --accent: var(--accent-cyan); }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.4s ease, color 0.3s ease;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 10;
    }

    .app-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }

    .neu-circle-btn {
      background: var(--bg);
      border: none;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      width: 46px;
      height: 46px;
      box-shadow: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light);
      transition: box-shadow 0.2s ease, transform 0.15s var(--ease-spring);
    }
    .neu-circle-btn:active {
      box-shadow: inset 4px 4px 10px var(--neu-dark), inset -4px -4px 10px var(--neu-light);
      transform: scale(0.94);
    }

    .main-player {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      touch-action: pan-y;
    }

    .player-card {
      width: 100%;
      max-width: 340px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-card);
      padding: 22px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transition: opacity 0.25s ease, transform 0.25s ease, background 0.3s ease, border-radius 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    [data-style="ios-glass"] .player-card { padding: 22px; }
    [data-style="ios-glass"] .album-frame {
      width: 100%;
      aspect-ratio: 1;
      border-radius: var(--radius-art);
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    [data-style="minimal-dark"] .player-card {
      background: #000000;
      border: 1px solid #1f1f1f;
      border-radius: 36px;
      --text: #ffffff;
      --subtext: #9a9a9a;
      --glass-btn: rgba(255,255,255,0.08);
      --glass-btn-hover: rgba(255,255,255,0.16);
      --card-border: rgba(255,255,255,0.12);
    }
    [data-style="minimal-dark"] .album-frame { width: 100%; aspect-ratio: 1; border-radius: 24px; background: #111111; margin-bottom: 20px; }

    [data-style="spotify"] .player-card { background: transparent; border: none; box-shadow: none; backdrop-filter: none; }
    [data-style="spotify"] .album-frame { width: 100%; aspect-ratio: 1; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 16px 36px rgba(0,0,0,0.4); }

    /* ---------- Sunset — warm gradient backdrop, frosted white card, glowing accent
       play button. Card forces its own light-surface variables so it stays readable
       regardless of the app's global dark/light setting. ---------- */
    [data-style="sunset"] body {
      background: linear-gradient(150deg, #ff9a5a 0%, #ff5f75 55%, #b3204f 100%);
    }
    [data-style="sunset"] .player-card {
      background: rgba(255, 255, 255, 0.95);
      border: none;
      border-radius: 34px;
      box-shadow: 0 20px 45px rgba(120, 20, 40, 0.35);
      --text: #1c1116;
      --subtext: #8a6b73;
      --glass-btn: rgba(0, 0, 0, 0.05);
      --glass-btn-hover: rgba(0, 0, 0, 0.1);
      --card-border: rgba(0, 0, 0, 0.08);
    }
    [data-style="sunset"] .album-frame {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 22px;
      margin-bottom: 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.2);
    }

    .album-frame {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .album-art { width: 100%; height: 100%; object-fit: cover; display: none; }

    .quote-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0,0,0,0.15));
    }

    .quote-text { font-size: 14px; font-weight: 600; font-style: italic; line-height: 1.4; color: var(--text); }

    .track-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .track-title { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .track-artist { font-size: 13px; color: var(--subtext); margin-top: 2px; }

    .fav-btn {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: var(--bg);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
      box-shadow: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light);
      transition: box-shadow 0.2s ease, transform 0.15s var(--ease-spring);
    }
    .fav-btn:active {
      box-shadow: inset 4px 4px 10px var(--neu-dark), inset -4px -4px 10px var(--neu-light);
      transform: scale(0.92);
    }

    .progress-box { margin-bottom: 16px; }
    .progress-bar {
      width: 100%;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 4px;
      background: var(--card-border);
      outline: none;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent);
    }

    .time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--subtext); margin-top: 6px; font-variant-numeric: tabular-nums; }

    .controls-row { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 8px; padding: 0 4px; }

    .ctrl-btn {
      background: var(--glass-btn);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      opacity: 0.85;
      box-shadow: 0 6px 16px rgba(0,0,0,0.28);
      text-shadow: 0 0 7px var(--accent);
    }

    .ctrl-btn:active { transform: scale(0.88); }

    .ctrl-btn.active-glow {
      opacity: 1;
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 6px 16px rgba(0,0,0,0.28), 0 0 14px var(--accent);
      text-shadow: 0 0 10px var(--accent);
    }

    @keyframes fav-bounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.35) rotate(-8deg); }
      70% { transform: scale(0.92); }
      100% { transform: scale(1); }
    }

    .play-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      opacity: 1;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3), 0 0 15px var(--accent);
      text-shadow: 0 0 8px rgba(255,255,255,0.7);
    }

    .play-btn:active { transform: scale(0.88) rotate(-3deg); }

    .soundbars { display: flex; align-items: flex-end; gap: 3px; height: 18px; justify-content: center; margin-top: 10px; }
    .bar { width: 3px; background: var(--accent); height: 4px; border-radius: 2px; transition: height 0.1s ease; }
    .soundbars.playing .bar { animation: pulse 0.6s infinite alternate ease-in-out; }
    .soundbars.playing .bar:nth-child(2n) { animation-delay: 0.2s; }
    .soundbars.playing .bar:nth-child(3n) { animation-delay: 0.4s; }
    @keyframes pulse { 0% { height: 4px; } 100% { height: 18px; } }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }

    .drawer-right {
      position: fixed;
      top: 0;
      right: -100%;
      width: 86%;
      max-width: 360px;
      height: 100%;
      background: var(--bg);
      border-left: 1px solid var(--card-border);
      z-index: 100;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
    }
    .drawer-right.open { right: 0; }

    .search-input {
      width: 100%;
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 14px;
      border: none;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      box-shadow: inset 3px 3px 8px var(--neu-dark), inset -3px -3px 8px var(--neu-light);
    }
    .search-input::placeholder { color: var(--subtext); }

    .nav-tabs { display: flex; gap: 10px; margin: 16px 0; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 1;
      white-space: nowrap;
      text-align: center;
      background: var(--bg);
      border: none;
      padding: 9px 12px;
      border-radius: 14px;
      color: var(--subtext);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 4px 4px 10px var(--neu-dark), -4px -4px 10px var(--neu-light);
      transition: box-shadow 0.2s ease, color 0.25s ease, transform 0.15s var(--ease-spring);
    }

    .tab-btn:active {
      box-shadow: inset 3px 3px 8px var(--neu-dark), inset -3px -3px 8px var(--neu-light);
      transform: scale(0.94);
    }
    .tab-btn.active {
      color: var(--accent);
      box-shadow: 4px 4px 10px var(--neu-dark), -4px -4px 10px var(--neu-light), 0 0 0 1.5px var(--accent) inset;
    }

    .list-container { flex: 1; overflow-y: auto; }

    @keyframes fade-slide-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .group-header { font-size: 13px; font-weight: 700; padding: 10px 0 4px 0; color: var(--accent); border-bottom: 1px solid var(--card-border); }

    .list-item {
      padding: 12px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s var(--ease-spring);
      animation: fade-slide-in 0.25s ease backwards;
      border-radius: 10px;
    }
    .list-item:active { background: var(--glass-btn-hover); transform: scale(0.98); }
    .list-item.now-playing { color: var(--accent); }

    .empty-hint { font-size: 12px; color: var(--subtext); padding-top: 10px; line-height: 1.6; }

    .file-import-box { display: flex; flex-direction: column; gap: 14px; padding-top: 10px; }

    .import-card {
      background: var(--bg);
      border: none;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      box-shadow: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light);
      transition: box-shadow 0.2s ease, transform 0.15s var(--ease-spring);
      animation: fade-slide-in 0.3s ease backwards;
    }
    .import-card:active {
      box-shadow: inset 4px 4px 10px var(--neu-dark), inset -4px -4px 10px var(--neu-light);
      transform: scale(0.97);
    }
    .import-card h4 { font-size: 14px; color: var(--text); margin-bottom: 4px; }
    .import-card p { font-size: 11px; color: var(--subtext); }

    /* ---------- Floating search button — sits beside the settings cluster ---------- */
    .floating-search-btn {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: 86px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--bg);
      color: var(--text);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 130;
      box-shadow: 7px 7px 16px var(--neu-dark), -7px -7px 16px var(--neu-light);
      transition: box-shadow 0.2s ease, transform 0.2s var(--ease-spring), opacity 0.2s ease;
    }
    .floating-search-btn:active {
      box-shadow: inset 4px 4px 10px var(--neu-dark), inset -4px -4px 10px var(--neu-light);
      transform: scale(0.92);
    }

    .fab-cluster {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: 20px;
      z-index: 130;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
      transition: opacity 0.2s ease;
    }

    /* Hide the floating buttons while the library panel covers the screen */
    .drawer-right.open ~ .floating-search-btn,
    .drawer-right.open ~ .fab-cluster {
      opacity: 0;
      pointer-events: none;
    }

    .fab-item { position: relative; display: flex; align-items: center; }

    .mini-fab {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--bg);
      border: none;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 5px 5px 12px var(--neu-dark), -5px -5px 12px var(--neu-light);
      opacity: 0;
      transform: scale(0.35) translateY(14px);
      pointer-events: none;
      transition: opacity 0.22s var(--ease-spring), transform 0.28s var(--ease-spring), box-shadow 0.2s ease;
    }
    .mini-fab:active {
      box-shadow: inset 3px 3px 8px var(--neu-dark), inset -3px -3px 8px var(--neu-light);
      transform: scale(0.88);
    }

    .fab-cluster.open .mini-fab { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
    .fab-cluster.open .mini-fab#mini-theme { transition-delay: 0.02s; }
    .fab-cluster.open .mini-fab#mini-color { transition-delay: 0.06s; }
    .fab-cluster.open .mini-fab#mini-template { transition-delay: 0.10s; }

    .floating-settings-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--bg);
      color: var(--text);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 7px 7px 16px var(--neu-dark), -7px -7px 16px var(--neu-light);
      transition: box-shadow 0.2s ease, transform 0.2s var(--ease-spring);
    }
    .floating-settings-btn:active {
      box-shadow: inset 4px 4px 10px var(--neu-dark), inset -4px -4px 10px var(--neu-light);
      transform: scale(0.92);
    }
    .floating-settings-btn.open {
      box-shadow: inset 4px 4px 10px var(--neu-dark), inset -4px -4px 10px var(--neu-light);
    }

    .fab-icon { display: flex; transition: transform 0.3s var(--ease-spring); }
    .floating-settings-btn.open .fab-icon { transform: rotate(90deg); }

    .popout-strip {
      position: absolute;
      right: 58px;
      top: 50%;
      transform: translateY(-50%) scale(0.6);
      transform-origin: right center;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s var(--ease-spring), transform 0.22s var(--ease-spring);
      white-space: nowrap;
    }
    .popout-strip.open { opacity: 1; transform: translateY(-50%) scale(1); pointer-events: auto; }

    .popout-templates { flex-direction: column; border-radius: 18px; max-height: 264px; overflow-y: auto; }

    .color-swatch {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
      box-shadow: 4px 4px 10px var(--neu-dark), -4px -4px 10px var(--neu-light);
      transition: box-shadow 0.2s ease, transform 0.15s var(--ease-spring);
    }
    .color-swatch:active { transform: scale(0.88); }
    .color-swatch.active { box-shadow: 4px 4px 10px var(--neu-dark), -4px -4px 10px var(--neu-light), 0 0 0 2px var(--accent); }
    .color-swatch .dot { width: 16px; height: 16px; border-radius: 50%; }

    .template-pill {
      padding: 8px 14px;
      border-radius: 14px;
      background: var(--bg);
      border: none;
      color: var(--subtext);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 4px 4p
