<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Minimal Music Player</title>

  <!-- Restore saved theme before first paint, to avoid a flash of the wrong mode -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mp_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Security: no external script sources needed anymore — everything runs from this one file -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="no-referrer" />

  <link rel="manifest" id="manifest-placeholder" />
  <meta name="theme-color" content="#0b0b0d" id="theme-color-meta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="color-scheme" content="dark light" />

  <style>
    :root {
      --bg: #0b0b0d;
      --bg-elevated: #17171a;
      --text: #ffffff;
      --subtext: #9a9aa2;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-btn-hover: rgba(255, 255, 255, 0.22);
      --bar: #ffffff;
      --dynamic-accent: rgba(124, 108, 255, 0.45);
      --dynamic-accent-solid: #7c6cff;
      --danger: #ff5f5f;
      --radius-lg: 28px;
      --radius-md: 18px;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="light"] {
      --bg: #f3f3f6;
      --bg-elevated: #ffffff;
      --text: #16161a;
      --subtext: #6b6b74;
      --glass-bg: rgba(0, 0, 0, 0.045);
      --glass-border: rgba(0, 0, 0, 0.1);
      --glass-btn-hover: rgba(0, 0, 0, 0.12);
      --bar: #16161a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.4s var(--ease-smooth), color 0.4s var(--ease-smooth);
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    input, button { user-select: none; }

    :focus-visible {
      outline: 2px solid var(--dynamic-accent-solid);
      outline-offset: 3px;
      border-radius: 6px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 10;
    }

    .header-actions { display: flex; gap: 10px; }

    .glass-btn {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.25s var(--ease-spring), background 0.2s ease, box-shadow 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
    }

    .glass-btn:hover { background: var(--glass-btn-hover); }
    .glass-btn:active { transform: scale(0.88); background: var(--glass-btn-hover); }

    .icon-nav { width: 42px; height: 42px; font-size: 18px; }
    .icon-nav.small { width: 34px; height: 34px; font-size: 14px; }

    .main-player {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      touch-action: pan-y;
      min-height: 0;
    }

    /* Album cover + volume rail sit side by side */
    .cover-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 22px;
    }

    .album-frame {
      position: relative;
      width: 100%;
      max-width: 220px;
      aspect-ratio: 1;
      flex: 0 0 auto;
    }

    .album-frame::before {
      content: '';
      position: absolute;
      inset: -28px;
      background: radial-gradient(circle, var(--dynamic-accent) 0%, transparent 72%);
      filter: blur(34px);
      z-index: -1;
      opacity: 0.7;
      animation: breathe 5s ease-in-out infinite;
      transition: background 0.7s ease;
      pointer-events: none;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.06); }
    }

    .album-disc {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
      transition: transform 0.35s var(--ease-smooth), opacity 0.3s ease;
    }

    .main-player.track-transition .album-disc,
    .main-player.track-transition .track-meta { opacity: 0; transform: scale(0.97); }

    .album-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      transform-origin: center;
      animation: spin 20s linear infinite;
      animation-play-state: paused;
    }

    .album-art.is-playing { animation-play-state: running; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .quote-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px;
      text-align: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(0,0,0,0.12));
    }

    .quote-mark { font-size: 30px; opacity: 0.35; line-height: 1; margin-bottom: 6px; }
    .quote-text { font-size: 13.5px; font-weight: 600; line-height: 1.4; letter-spacing: 0.1px; }

    /* Volume rail */
    .volume-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .volume-slider-wrap {
      position: relative;
      width: 34px;
      height: 150px;
    }

    .volume-slider {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150px;
      height: 4px;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
      transform: translate(-50%, -50%) rotate(-90deg);
      border-radius: 4px;
      background: linear-gradient(to right, var(--dynamic-accent-solid) var(--vfill, 80%), var(--glass-border) var(--vfill, 80%));
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.08);
      transition: transform 0.15s var(--ease-spring);
    }

    .volume-slider:active::-webkit-slider-thumb { transform: scale(1.3); }

    .track-meta {
      width: 100%;
      max-width: 300px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .track-meta .details { overflow: hidden; padding-right: 12px; }
    .track-title { font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; }
    .track-artist { font-size: 13px; color: var(--subtext); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .progress-box { width: 100%; max-width: 300px; margin-bottom: 18px; }

    .time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--subtext); margin-top: 6px; font-variant-numeric: tabular-nums; }

    .progress-bar {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 4px;
      background: linear-gradient(to right, var(--dynamic-accent-solid) var(--fill, 0%), var(--glass-border) var(--fill, 0%));
      outline: none;
      transition: height 0.15s ease;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.08);
      transition: transform 0.15s var(--ease-spring);
    }

    .progress-bar:active::-webkit-slider-thumb { transform: scale(1.3); }

    .controls-row {
      width: 100%;
      max-width: 300px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .ctrl-btn { width: 48px; height: 48px; font-size: 18px; opacity: 0.55; }
    .ctrl-btn.active-toggle { opacity: 1; box-shadow: 0 0 0 1px var(--dynamic-accent-solid) inset; }

    .play-btn {
      width: 62px;
      height: 62px;
      font-size: 22px;
      background: var(--text);
      color: var(--bg);
      border: none;
      opacity: 1;
    }

    .play-btn:active { transform: scale(0.9) rotate(-2deg); }

    .soundbars { display: flex; align-items: flex-end; gap: 3px; height: 26px; }

    .bar {
      width: 3px;
      background: linear-gradient(to top, var(--dynamic-accent-solid), var(--bar));
      height: 4px;
      border-radius: 2px;
      transition: height 0.08s ease-out;
    }

    /* Drawer (library) */
    .drawer {
      position: fixed;
      top: 0;
      left: -100%;
      width: 82%;
      max-width: 340px;
      height: 100%;
      background: var(--bg-elevated);
      border-right: 1px solid var(--glass-border);
      z-index: 100;
      transition: left 0.35s var(--ease-smooth);
      display: flex;
      flex-direction: column;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
    }

    .drawer.open { left: 0; }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(2px);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.open { opacity: 1; pointer-events: auto; }

    .drawer h2 { font-size: 20px; letter-spacing: -0.3px; }

    .search-input {
      width: 100%;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text);
      font-size: 13px;
    }

    .search-input::placeholder { color: var(--subtext); }

    .nav-tabs { display: flex; gap: 8px; margin: 14px 0; }

    .tab-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 6px 14px;
      border-radius: 12px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s var(--ease-spring);
    }

    .tab-btn:active { transform: scale(0.94); }
    .tab-btn.active { background: var(--text); color: var(--bg); }

    .list-container { flex: 1; overflow-y: auto; }

    .drill-back {
      font-size: 12.5px;
      color: var(--dynamic-accent-solid);
      padding: 6px 4px 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .drill-heading {
      font-size: 16px;
      font-weight: 700;
      padding: 0 4px 10px;
    }

    .list-item {
      padding: 12px 4px;
      border-bottom: 1px solid var(--glass-border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: item-in 0.25s var(--ease-smooth) backwards;
      transition: background 0.15s ease;
    }

    .list-item:active { background: var(--glass-bg); }
    .list-item.now-playing .li-title { color: var(--dynamic-accent-solid); }

    @keyframes item-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .li-title { font-weight: 600; font-size: 14px; }
    .li-sub { font-size: 12px; color: var(--subtext); margin-top: 2px; }
    .li-chevron { color: var(--subtext); font-size: 13px; }

    .empty-state { font-size: 12.5px; color: var(--subtext); padding-top: 16px; line-height: 1.6; text-align: center; }

    .drawer-footer {
      border-top: 1px solid var(--glass-border);
      padding-top: 14px;
      margin-top: 10px;
      font-size: 11.5px;
      color: var(--subtext);
    }

    .storage-bar-track { width: 100%; height: 4px; border-radius: 4px; background: var(--glass-border); margin: 8px 0; overflow: hidden; }
    .storage-bar-fill { height: 100%; background: var(--dynamic-accent-solid); width: 0%; transition: width 0.4s ease; }

    .text-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 12px;
      cursor: pointer;
      padding: 8px 0;
      text-decoration: underline;
    }

    .install-row { margin-top: 10px; }
    .install-btn {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: var(--dynamic-accent-solid);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    #folder-input { display: none; }

    /* Settings modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(2px);
      z-index: 150;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--bg-elevated);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 22px;
      width: 85%;
      max-width: 320px;
      transform: scale(0.92);
      transition: transform 0.25s var(--ease-spring);
    }

    .modal-overlay.open .modal-card { transform: scale(1); }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .modal-header h2 { font-size: 18px; letter-spacing: -0.3px; }

    .settings-label {
      font-size: 11px;
      color: var(--subtext);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 700;
    }

    .swatch-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 4px; }

    .swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s var(--ease-spring);
      position: relative;
    }

    .swatch:active { transform: scale(0.88); }
    .swatch.selected { box-shadow: 0 0 0 2px var(--bg-elevated), 0 0 0 4px var(--text); }
    .swatch-auto { background: conic-gradient(from 0deg, #7c6cff, #ff6f9c, #ffb545, #3ddc97, #4fb8ff, #7c6cff); }
    .swatch-label { font-size: 9.5px; text-align: center; margin-top: 5px; color: var(--subtext); }
    .swatch-wrap { display: flex; flex-direction: column; align-items: center; }

    /* Toasts */
    .toast-container {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      z-index: 200;
      pointer-events: none;
      width: 90%;
      max-width: 320px;
      align-items: center;
    }

    .toast {
      background: var(--bg-elevated);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 12.5px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      animation: toast-in 0.3s var(--ease-spring) forwards, toast-out 0.3s ease 2.6s forwards;
    }

    @keyframes toast-in { from { opacity: 0; transform: translateY(12px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toast-out { to { opacity: 0; transform: translateY(-8px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <button class="glass-btn icon-nav" onclick="toggleDrawer()" aria-label="Open library">☰</button>
    <div class="header-actions">
      <button class="glass-btn icon-nav" id="add-btn" onclick="document.getElementById('folder-input').click()" aria-label="Add music folder">📁</button>
      <button class="glass-btn icon-nav" id="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle light or dark mode">🌙</button>
      <button class="glass-btn icon-nav" id="settings-btn" onclick="openSettings()" aria-label="Open settings">⚙️</button>
    </div>
  </header>

  <main class="main-player" id="swipe-area">
    <div class="cover-row">
      <div class="album-frame">
        <div class="album-disc" id="album-disc">
          <img id="player-art" class="album-art" alt="Album cover" />
          <div id="quote-container" class="quote-box">
            <div class="quote-mark">"</div>
            <div class="quote-text" id="quote-text">Music is the soundtrack of your life.</div>
          </div>
        </div>
      </div>

      <div class="volume-rail">
        <button class="glass-btn icon-nav small" id="mute-btn" onclick="toggleMute()" aria-label="Mute or unmute">🔊</button>
        <div class="volume-slider-wrap">
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80" oninput="setVolume(this.value)" aria-label="Volume" />
        </div>
      </div>
    </div>

    <div class="track-meta">
      <div class="details">
        <div class="track-title" id="player-title">No track loaded</div>
        <div class="track-artist" id="player-artist">Tap 📁 to add local songs</div>
      </div>
    </div>

    <div class="progress-box">
      <input type="range" class="progress-bar" id="seek-bar" value="0" max="100" aria-label="Seek" />
      <div class="time-row">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>

    <div class="controls-row">
      <button class="glass-btn ctrl-btn" id="shuffle-btn" onclick="toggleShuffle()" aria-label="Shuffle">🔀</button>
      <button class="glass-btn ctrl-btn" onclick="playPrev()" aria-label="Previous track">⏮</button>
      <button class="glass-btn ctrl-btn play-btn" id="play-btn" onclick="togglePlay()" aria-label="Play or pause">▶</button>
      <button class="glass-btn ctrl-btn" onclick="playNext()" aria-label="Next track">⏭</button>
      <button class="glass-btn ctrl-btn" id="repeat-btn" onclick="toggleRepeat()" aria-label="Repeat">🔁</button>
    </div>

    <div class="soundbars" id="soundbars" aria-hidden="true">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div>
    </div>
  </main>

  <div class="drawer-overlay" id="overlay" onclick="toggleDrawer()"></div>
  <div class="drawer" id="drawer">
    <h2>Library</h2>
    <input class="search-input" id="search-input" type="text" placeholder="Search songs or artists" oninput="handleSearch(this.value)" />
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="renderView('songs', this)">Songs</button>
      <button class="tab-btn" onclick="renderView('albums', this)">Albums</button>
      <button class="tab-btn" onclick="renderView('artists', this)">Artists</button>
    </div>
    <div class="list-container" id="list-container">
      <div class="empty-state">No offline songs saved yet. Tap the folder icon to add some — they'll stay saved on this device from then on.</div>
    </div>

    <div class="install-row" id="install-row" style="display:none;">
      <button class="install-btn" id="install-btn" onclick="promptInstall()">Install app for lock-screen controls</button>
    </div>

    <div class="drawer-footer">
      <div>Offline storage: <span id="storage-status">checking…</span></div>
      <div class="storage-bar-track"><div class="storage-bar-fill" id="storage-bar-fill"></div></div>
      <button class="text-btn" onclick="clearLibrary()">Clear saved library</button>
    </div>
  </div>

  <div class="modal-overlay" id="settings-overlay" onclick="closeSettings(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="glass-btn icon-nav small" onclick="closeSettings()" aria-label="Close settings">✕</button>
      </div>
      <div class="settings-label">Accent color</div>
      <div class="swatch-grid" id="swatch-grid"></div>
    </div>
  </div>

  <input type="file" id="folder-input" webkitdirectory directory multiple accept="audio/*" />
  <audio id="audio-player"></audio>

  <div class="toast-container" id="toast-container"></div>

  <script>
    'use strict';

    const quotes = [
      "Where words fail, music speaks.",
      "One good thing about music: when it hits you, you feel no pain.",
      "Turn your passion into power.",
      "Music cleanses the soul from everyday life.",
      "Stay hungry, stay foolish.",
      "Your energy creates your reality.",
      "Some days the song finds you."
    ];

    const ACCENT_PRESETS = [
      { key: 'violet', hex: '#7c6cff', label: 'Violet' },
      { key: 'rose', hex: '#ff6f9c', label: 'Rose' },
      { key: 'amber', hex: '#ffb545', label: 'Amber' },
      { key: 'emerald', hex: '#3ddc97', label: 'Emerald' },
      { key: 'sky', hex: '#4fb8ff', label: 'Sky' },
      { key: 'mono', hex: '#c9c9d1', label: 'Mono' }
    ];

    let playlist = [];
    let currentIndex = -1;
    let isShuffle = false;
    let isRepeat = false;
    let deferredInstallPrompt = null;
    let currentFilter = '';
    let currentTab = 'songs';
    let drill = null; // { type: 'artist'|'album', name }
    let accentMode = 'auto';
    let lastVolume = 0.8;

    const audio = document.getElementById('audio-player');
    const seekBar = document.getElementById('seek-bar');
    const volumeSlider = document.getElementById('volume-slider');
    const barEls = Array.from(document.querySelectorAll('.bar'));

    // ---------- Toasts ----------
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // ---------- App icon / manifest (generated at runtime, no external image needed) ----------
    const ICON_SVG = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236d5efc'/><stop offset='1' stop-color='%23ff6fa5'/></linearGradient></defs><rect width='200' height='200' rx='44' fill='url(%23g)'/><circle cx='100' cy='100' r='46' fill='rgba(255,255,255,0.18)'/><circle cx='100' cy='100' r='14' fill='white'/><path d='M100 40 a60 60 0 0 1 60 60' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' opacity='0.85'/></svg>";
    const ICON_DATA_URI = "data:image/svg+xml," + ICON_SVG;

    (function setupManifestAndIcon() {
      const manifest = {
        name: "Minimal Music Player",
        short_name: "MusicPlayer",
        description: "A minimal, offline-first local music player.",
        start_url: "./",
        scope: "./",
        display: "standalone",
        orientation: "portrait",
        background_color: "#0b0b0d",
        theme_color: "#0b0b0d",
        icons: [
          { src: ICON_DATA_URI, sizes: "192x192", type: "image/svg+xml", purpose: "any" },
          { src: ICON_DATA_URI, sizes: "512x512", type: "image/svg+xml", purpose: "any" },
          { src: ICON_DATA_URI, sizes: "512x512", type: "image/svg+xml", purpose: "maskable" }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(blob));

      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = ICON_DATA_URI;
      document.head.appendChild(appleIcon);
    })();

    // ---------- Offline service worker ----------
    // Only meaningful when this file is actually hosted over http(s) alongside sw.js —
    // service workers cannot register at all on file:// pages (a browser restriction,
    // not something this app can work around), so we don't even try there.
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(() => {
        // No sw.js next to this file, or registration failed — the app still works
        // fully offline once loaded, this just skips the extra network-level caching.
      });
    }

    // ---------- Persistent storage ----------
    async function ensurePersistentStorage() {
      if (!(navigator.storage && navigator.storage.persist)) return;
      try {
        const already = await navigator.storage.persisted();
        if (!already) await navigator.storage.persist();
        updateStorageStatus();
      } catch (e) {}
    }

    async function updateStorageStatus() {
      const statusEl = document.getElementById('storage-status');
      const fillEl = document.getElementById('storage-bar-fill');
      try {
        const persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false;
        let usageText = '';
        if (navigator.storage && navigator.storage.estimate) {
          const { usage, quota } = await navigator.storage.estimate();
          const usedMB = (usage / (1024 * 1024)).toFixed(1);
          const quotaMB = (quota / (1024 * 1024)).toFixed(0);
          const pct = quota ? Math.min(100, (usage / quota) * 100) : 0;
          fillEl.style.width = pct + '%';
          usageText = `${usedMB} MB used of ${quotaMB} MB`;
        }
        statusEl.textContent = (persisted ? 'Persistent · ' : 'Standard · ') + usageText;
      } catch (e) {
        statusEl.textContent = 'unavailable';
      }
    }

    // ---------- IndexedDB ----------
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('MusicStorageDB', 2);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains('tracks')) {
            req.result.createObjectStore('tracks', { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveTrackToDB(track) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('tracks', 'readwrite');
        tx.objectStore('tracks').put(track);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadStoredTracks() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('tracks', 'readonly');
        const req = tx.objectStore('tracks').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    async function clearLibrary() {
      if (!confirm('Remove all saved songs from this device? This cannot be undone.')) return;
      try {
        const db = await openDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction('tracks', 'readwrite');
          tx.objectStore('tracks').clear();
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
        playlist.forEach(t => { try { URL.revokeObjectURL(t.url); } catch (e) {} });
        playlist = [];
        currentIndex = -1;
        drill = null;
        audio.pause();
        audio.removeAttribute('src');
        document.getElementById('player-title').textContent = 'No track loaded';
        document.getElementById('player-artist').textContent = 'Tap 📁 to add local songs';
        renderList();
        updateStorageStatus();
        showToast('Library cleared');
      } catch (e) {
        showToast('Could not clear library');
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      buildSwatches();
      restorePreferences();
      ensurePersistentStorage();
      updateStorageStatus();
      const savedTracks = await loadStoredTracks();
      if (savedTracks.length > 0) {
        playlist = savedTracks.map(t => ({ ...t, url: URL.createObjectURL(t.blob) }));
        renderList();
        loadTrack(0, false);
        showToast(`Loaded ${savedTracks.length} saved song${savedTracks.length === 1 ? '' : 's'}`);
      }
    });

    // ---------- Adding music (dedupes against what's already saved) ----------
    document.getElementById('folder-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('audio/'));
      if (!files.length) { showToast('No audio files found in that folder'); return; }

      const addBtn = document.getElementById('add-btn');
      addBtn.textContent = '⏳';

      const existingIds = new Set(playlist.map(t => t.id));
      let added = 0, skipped = 0;

      for (const file of files) {
        const id = `${file.name}_${file.size}_${file.lastModified}`;
        if (existingIds.has(id)) { skipped++; continue; }

        let meta = {};
        try { meta = await readTags(file); } catch (e) { meta = {}; }

        const trackObj = {
          id,
          title: meta.title || file.name.replace(/\.[^/.]+$/, ""),
          artist: meta.artist || "Unknown Artist",
          album: meta.album || "Unknown Album",
          blob: file,
          art: meta.art || null
        };

        try {
          await saveTrackToDB(trackObj);
        } catch (e) {
          showToast('Storage full — could not save all songs');
          break;
        }

        trackObj.url = URL.createObjectURL(file);
        playlist.push(trackObj);
        existingIds.add(id);
        added++;
      }

      addBtn.textContent = '📁';
      renderList();
      updateStorageStatus();
      if (added) showToast(`Added ${added} song${added === 1 ? '' : 's'}${skipped ? `, skipped ${skipped} already saved` : ''}`);
      else if (skipped) showToast('Those songs are already saved');

      if (currentIndex === -1 && playlist.length) loadTrack(0, false);
      e.target.value = '';
    });

    // ---------- Self-contained ID3 tag + embedded-art reader (no network, no third-party library) ----------
    function parseID3(buffer) {
      const bytes = new Uint8Array(buffer);
      const result = {};

      function synchsafe(b0, b1, b2, b3) {
        return ((b0 & 0x7f) << 21) | ((b1 & 0x7f) << 14) | ((b2 & 0x7f) << 7) | (b3 & 0x7f);
      }
      function beInt(b0, b1, b2, b3) {
        return ((b0 << 24) | (b1 << 16) | (b2 << 8) | b3) >>> 0;
      }
      function latin1(arr) {
        let s = '';
        for (let i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
        return s.replace(/\0+$/, '').trim();
      }
      function utf16(arr) {
        if (arr.length < 2) return '';
        let big = false, start = 0;
        if (arr[0] === 0xFF && arr[1] === 0xFE) { big = false; start = 2; }
        else if (arr[0] === 0xFE && arr[1] === 0xFF) { big = true; start = 2; }
        let s = '';
        for (let i = start; i + 1 < arr.length; i += 2) {
          const code = big ? (arr[i] << 8) | arr[i + 1] : arr[i] | (arr[i + 1] << 8);
          if (code === 0) break;
          s += String.fromCharCode(code);
        }
        return s.trim();
      }
      function utf16be(arr) {
        let s = '';
        for (let i = 0; i + 1 < arr.length; i += 2) {
          const code = (arr[i] << 8) | arr[i + 1];
          if (code === 0) break;
          s += String.fromCharCode(code);
        }
        return s.trim();
      }
      function utf8(arr) {
        try { return new TextDecoder('utf-8').decode(arr).replace(/\0+$/, '').trim(); }
        catch (e) { return latin1(arr); }
      }
      function decodeText(encoding, arr) {
        if (encoding === 1) return utf16(arr);
        if (encoding === 2) return utf16be(arr);
        if (encoding === 3) return utf8(arr);
        return latin1(arr);
      }
      function nullTermEnd(encoding, arr, start) {
        if (encoding === 1 || encoding === 2) {
          for (let i = start; i + 1 < arr.length; i += 2) {
            if (arr[i] === 0 && arr[i + 1] === 0) return i;
          }
          return arr.length;
        }
        for (let i = start; i < arr.length; i++) if (arr[i] === 0) return i;
        return arr.length;
      }
      function bytesToBase64(arr) {
        let binary = '';
        const chunk = 0x8000;
        for (let i = 0; i < arr.length; i += chunk) {
          binary += String.fromCharCode.apply(null, arr.subarray(i, Math.min(i + chunk, arr.length)));
        }
        return btoa(binary);
      }

      if (bytes.length > 10 && bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33) {
        const majorVersion = bytes[3];
        const flags = bytes[5];
        const tagSize = synchsafe(bytes[6], bytes[7], bytes[8], bytes[9]);
        let offset = 10;
        const tagEnd = Math.min(bytes.length, 10 + tagSize);

        if (flags & 0x40) {
          if (majorVersion >= 4) {
            offset += synchsafe(bytes[offset], bytes[offset + 1], bytes[offset + 2], bytes[offset + 3]);
          } else {
            offset += 4 + beInt(bytes[offset], bytes[offset + 1], bytes[offset + 2], bytes[offset + 3]);
          }
        }

        while (offset < tagEnd - 10) {
          let frameId, frameSize, headerLen;
          if (majorVersion === 2) {
            frameId = latin1(bytes.slice(offset, offset + 3));
            frameSize = beInt(0, bytes[offset + 3], bytes[offset + 4], bytes[offset + 5]);
            headerLen = 6;
          } else {
            frameId = latin1(bytes.slice(offset, offset + 4));
            frameSize = majorVersion >= 4
              ? synchsafe(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7])
              : beInt(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
            headerLen = 10;
          }

          if (!frameId || frameId.charCodeAt(0) === 0 || frameSize <= 0 || offset + headerLen + frameSize > bytes.length) break;

          const frameStart = offset + headerLen;
          const frameData = bytes.slice(frameStart, frameStart + frameSize);

          try {
            if (frameId === 'TIT2' || frameId === 'TT2') {
              result.title = decodeText(frameData[0], frameData.slice(1));
            } else if (frameId === 'TPE1' || frameId === 'TP1') {
              result.artist = decodeText(frameData[0], frameData.slice(1));
            } else if (frameId === 'TALB' || frameId === 'TAL') {
              result.album = decodeText(frameData[0], frameData.slice(1));
            } else if (frameId === 'APIC' || frameId === 'PIC') {
              const encoding = frameData[0];
              let p = 1;
              let mime;
              if (frameId === 'APIC') {
                const mimeEnd = frameData.indexOf(0, p);
                mime = latin1(frameData.slice(p, mimeEnd < 0 ? p : mimeEnd));
                p = (mimeEnd < 0 ? p : mimeEnd) + 1;
              } else {
                const fmt = latin1(frameData.slice(p, p + 3));
                mime = fmt === 'PNG' ? 'image/png' : 'image/jpeg';
                p += 3;
              }
              p += 1; // picture type byte
              const descEnd = nullTermEnd(encoding, frameData, p);
              p = descEnd + (encoding === 1 || encoding === 2 ? 2 : 1);
              const picData = frameData.slice(p);
              if (picData.length > 200) {
                const safeMime = mime && mime.indexOf('image') === 0 ? mime : 'image/jpeg';
                result.art = `data:${safeMime};base64,${bytesToBase64(picData)}`;
              }
            }
          } catch (e) { /* skip malformed frame, keep parsing the rest */ }

          offset = frameStart + frameSize;
        }
      }

      if ((!result.title || !result.artist) && bytes.length >= 128) {
        const tail = bytes.slice(bytes.length - 128);
        if (tail[0] === 0x54 && tail[1] === 0x41 && tail[2] === 0x47) {
          if (!result.title) { const t = latin1(tail.slice(3, 33)); if (t) result.title = t; }
          if (!result.artist) { const a = latin1(tail.slice(33, 63)); if (a) result.artist = a; }
          if (!result.album) { const al = latin1(tail.slice(63, 93)); if (al) result.album = al; }
        }
      }

      return result;
    }

    async function readTags(file) {
      try {
        const buffer = await file.arrayBuffer();
        return parseID3(buffer);
      } catch (e) {
        return {};
      }
    }

    // ---------- Dominant color extraction → ambient glow (signature visual) ----------
    function applyAmbientColor(imgEl) {
      try {
        const canvas = document.createElement('canvas');
        const size = 24;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgEl, 0, 0, size, size);
        const data = ctx.getImageData(0, 0, size, size).data;
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < data.length; i += 4) {
          r += data[i]; g += data[i + 1]; b += data[i + 2]; count++;
        }
        r = Math.round(r / count); g = Math.round(g / count); b = Math.round(b / count);
        document.documentElement.style.setProperty('--dynamic-accent', `rgba(${r}, ${g}, ${b}, 0.5)`);
        document.documentElement.style.setProperty('--dynamic-accent-solid', `rgb(${r}, ${g}, ${b})`);
      } catch (e) { resetAmbientColor(); }
    }

    function resetAmbientColor() {
      document.documentElement.style.setProperty('--dynamic-accent', 'rgba(124, 108, 255, 0.45)');
      document.documentElement.style.setProperty('--dynamic-accent-solid', '#7c6cff');
    }

    function hexToRgb(hex) {
      return { r: parseInt(hex.slice(1, 3), 16), g: parseInt(hex.slice(3, 5), 16), b: parseInt(hex.slice(5, 7), 16) };
    }

    function applyAccentPreset(hex) {
      const { r, g, b } = hexToRgb(hex);
      document.documentElement.style.setProperty('--dynamic-accent', `rgba(${r}, ${g}, ${b}, 0.5)`);
      document.documentElement.style.setProperty('--dynamic-accent-solid', hex);
    }

    // ---------- Real-time reactive equalizer (Web Audio API) ----------
    let audioCtx, analyser, dataArray, sourceNode;

    function setupAnalyser() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 32;
        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        animateBars();
      } catch (e) {}
    }

    function animateBars() {
      if (analyser && !audio.paused) {
        analyser.getByteFrequencyData(dataArray);
        barEls.forEach((bar, i) => {
          const v = dataArray[i % dataArray.length];
          bar.style.height = Math.max(4, (v / 255) * 26) + 'px';
        });
      } else {
        barEls.forEach(bar => { bar.style.height = '4px'; });
      }
      requestAnimationFrame(animateBars);
    }

    // ---------- Media Session (lock screen / notification controls) ----------
    function updateMediaSession(track) {
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title || 'Unknown title',
        artist: track.artist || 'Unknown artist',
        album: track.album || '',
        artwork: track.art ? [{ src: track.art, sizes: '512x512', type: 'image/png' }] : [{ src: ICON_DATA_URI, sizes: '512x512', type: 'image/svg+xml' }]
      });
      navigator.mediaSession.setActionHandler('play', () => togglePlay());
      navigator.mediaSession.setActionHandler('pause', () => togglePlay());
      navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
      navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
      navigator.mediaSession.setActionHandler('seekto', (details) => {
        if (details.seekTime !== undefined && audio.duration) audio.currentTime = details.seekTime;
      });
    }

    function updatePositionState() {
      if ('mediaSession' in navigator && navigator.mediaSession.setPositionState && audio.duration) {
        try {
          navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: audio.currentTime });
        } catch (e) {}
      }
    }

    // ---------- Preferences (theme, accent, volume) ----------
    function restorePreferences() {
      try {
        const theme = localStorage.getItem('mp_theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
      updateThemeIcon();

      try {
        const savedAccent = localStorage.getItem('mp_accent');
        if (savedAccent) accentMode = savedAccent;
      } catch (e) {}
      if (accentMode !== 'auto') {
        const preset = ACCENT_PRESETS.find(p => p.key === accentMode);
        if (preset) applyAccentPreset(preset.hex);
      }

      try {
        const savedVol = localStorage.getItem('mp_volume');
        if (savedVol !== null) lastVolume = parseFloat(savedVol);
      } catch (e) {}
      audio.volume = lastVolume;
      volumeSlider.value = Math.round(lastVolume * 100);
      updateVolumeUI();
    }

    // ---------- UI helpers ----------
    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    function openSettings() {
      document.getElementById('settings-overlay').classList.add('open');
    }
    function closeSettings(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('settings-overlay').classList.remove('open');
    }

    function updateThemeIcon() {
      const cur = document.documentElement.getAttribute('data-theme');
      document.getElementById('theme-toggle-btn').textContent = cur === 'dark' ? '🌙' : '☀️';
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      document.getElementById('theme-color-meta').setAttribute('content', next === 'dark' ? '#0b0b0d' : '#f3f3f6');
      updateThemeIcon();
      try { localStorage.setItem('mp_theme', next); } catch (e) {}
    }

    function buildSwatches() {
      const grid = document.getElementById('swatch-grid');
      grid.innerHTML = '';

      const autoWrap = document.createElement('div');
      autoWrap.className = 'swatch-wrap';
      const autoSwatch = document.createElement('div');
      autoSwatch.className = 'swatch swatch-auto' + (accentMode === 'auto' ? ' selected' : '');
      autoSwatch.setAttribute('role', 'button');
      autoSwatch.setAttribute('aria-label', 'Auto — match album art');
      autoSwatch.onclick = () => selectAccent('auto');
      const autoLabel = document.createElement('div');
      autoLabel.className = 'swatch-label';
      autoLabel.textContent = 'Auto';
      autoWrap.appendChild(autoSwatch);
      autoWrap.appendChild(autoLabel);
      grid.appendChild(autoWrap);

      ACCENT_PRESETS.forEach(p => {
        const wrap = document.createElement('div');
        wrap.className = 'swatch-wrap';
        const sw = document.createElement('div');
        sw.className = 'swatch' + (accentMode === p.key ? ' selected' : '');
        sw.style.background = p.hex;
        sw.setAttribute('role', 'button');
        sw.setAttribute('aria-label', p.label);
        sw.onclick = () => selectAccent(p.key);
        const label = document.createElement('div');
        label.className = 'swatch-label';
        label.textContent = p.label;
        wrap.appendChild(sw);
        wrap.appendChild(label);
        grid.appendChild(wrap);
      });
    }

    function selectAccent(mode) {
      accentMode = mode;
      try { localStorage.setItem('mp_accent', mode); } catch (e) {}

      if (mode === 'auto') {
        const artImg = document.getElementById('player-art');
        if (artImg.style.display === 'block' && artImg.complete) applyAmbientColor(artImg);
        else resetAmbientColor();
      } else {
        const preset = ACCENT_PRESETS.find(p => p.key === mode);
        if (preset) applyAccentPreset(preset.hex);
      }
      buildSwatches();
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function handleSearch(query) {
      currentFilter = query.trim().toLowerCase();
      renderList();
    }

    function matchesFilter(t) {
      return (t.title || '').toLowerCase().includes(currentFilter) || (t.artist || '').toLowerCase().includes(currentFilter);
    }

    function renderView(type, btn) {
      currentTab = type;
      drill = null;
      if (btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      renderList();
    }

    function appendEmpty(container, text) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = text;
      container.appendChild(empty);
    }

    function renderSongRows(items, container) {
      if (!items.length) { appendEmpty(container, 'No matches.'); return; }
      items.forEach(t => {
        const realIndex = playlist.indexOf(t);
        const row = document.createElement('div');
        row.className = 'list-item' + (realIndex === currentIndex ? ' now-playing' : '');

        const left = document.createElement('div');
        const titleEl = document.createElement('div');
        titleEl.className = 'li-title';
        titleEl.textContent = t.title;
        const subEl = document.createElement('div');
        subEl.className = 'li-sub';
        subEl.textContent = t.artist;
        left.appendChild(titleEl);
        left.appendChild(subEl);
        row.appendChild(left);

        row.addEventListener('click', () => { loadTrack(realIndex); toggleDrawer(); });
        container.appendChild(row);
      });
    }

    function renderList() {
      const container = document.getElementById('list-container');
      container.innerHTML = '';

      if (!playlist.length) {
        appendEmpty(container, "No offline songs saved yet. Tap the folder icon to add some — they'll stay saved on this device from then on.");
        return;
      }

      if (drill) {
        const backRow = document.createElement('div');
        backRow.className = 'drill-back';
        backRow.textContent = `← All ${drill.type === 'artist' ? 'Artists' : 'Albums'}`;
        backRow.addEventListener('click', () => { drill = null; renderList(); });
        container.appendChild(backRow);

        const heading = document.createElement('div');
        heading.className = 'drill-heading';
        heading.textContent = drill.name;
        container.appendChild(heading);

        let items = playlist.filter(t => (drill.type === 'artist' ? t.artist : t.album) === drill.name);
        if (currentFilter) items = items.filter(matchesFilter);
        renderSongRows(items, container);
        return;
      }

      if (currentTab === 'songs') {
        let items = playlist;
        if (currentFilter) items = items.filter(matchesFilter);
        renderSongRows(items, container);
      } else {
        const key = currentTab === 'albums' ? 'album' : 'artist';
        let items = playlist;
        if (currentFilter) items = items.filter(matchesFilter);
        const groups = {};
        items.forEach(t => {
          const name = t[key] || `Unknown ${key}`;
          groups[name] = (groups[name] || 0) + 1;
        });
        const names = Object.keys(groups).sort();
        if (!names.length) { appendEmpty(container, 'No matches.'); return; }
        names.forEach(name => {
          const row = document.createElement('div');
          row.className = 'list-item';
          const left = document.createElement('div');
          const titleEl = document.createElement('div');
          titleEl.className = 'li-title';
          titleEl.textContent = name;
          const subEl = document.createElement('div');
          subEl.className = 'li-sub';
          subEl.textContent = `${groups[name]} track${groups[name] === 1 ? '' : 's'}`;
          left.appendChild(titleEl);
          left.appendChild(subEl);
          const chevron = document.createElement('div');
          chevron.className = 'li-chevron';
          chevron.textContent = '›';
          row.appendChild(left);
          row.appendChild(chevron);
          row.addEventListener('click', () => { drill = { type: currentTab === 'albums' ? 'album' : 'artist', name }; renderList(); });
          container.appendChild(row);
        });
      }
    }

    // ---------- Volume ----------
    function updateVolumeUI() {
      const pct = Math.round(audio.volume * 100);
      volumeSlider.style.setProperty('--vfill', pct + '%');
      document.getElementById('mute-btn').textContent = audio.volume === 0 ? '🔇' : (audio.volume < 0.5 ? '🔉' : '🔊');
    }

    function setVolume(val) {
      audio.volume = val / 100;
      if (audio.volume > 0) lastVolume = audio.volume;
      updateVolumeUI();
      try { localStorage.setItem('mp_volume', String(audio.volume)); } catch (e) {}
    }

    function toggleMute() {
      if (audio.volume > 0) {
        lastVolume = audio.volume;
        audio.volume = 0;
      } else {
        audio.volume = lastVolume || 0.8;
      }
      volumeSlider.value = Math.round(audio.volume * 100);
      updateVolumeUI();
      try { localStorage.setItem('mp_volume', String(audio.volume)); } catch (e) {}
    }

    // ---------- Swipe gestures ----------
    const swipeArea = document.getElementById('swipe-area');
    let touchStartX = 0;
    swipeArea.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    swipeArea.addEventListener('touchend', e => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) playNext();
      if (touchEndX > touchStartX + 50) playPrev();
    }, { passive: true });

    // ---------- Playback ----------
    function loadTrack(index, autoPlay = true) {
      if (!playlist[index]) return;
      currentIndex = index;
      const track = playlist[currentIndex];
      const mainEl = document.querySelector('.main-player');

      mainEl.classList.add('track-transition');
      setTimeout(() => {
        audio.src = track.url;
        document.getElementById('player-title').textContent = track.title;
        document.getElementById('player-artist').textContent = track.artist;

        const artImg = document.getElementById('player-art');
        const quoteBox = document.getElementById('quote-container');

        if (track.art) {
          artImg.onload = () => { if (accentMode === 'auto') applyAmbientColor(artImg); };
          artImg.src = track.art;
          artImg.style.display = 'block';
          quoteBox.style.display = 'none';
        } else {
          artImg.style.display = 'none';
          quoteBox.style.display = 'flex';
          document.getElementById('quote-text').textContent = quotes[Math.floor(Math.random() * quotes.length)];
          if (accentMode === 'auto') resetAmbientColor();
        }

        updateMediaSession(track);
        renderList();
        mainEl.classList.remove('track-transition');

        if (autoPlay) startPlayback();
      }, 120);
    }

    function startPlayback() {
      setupAnalyser();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      audio.play().catch(() => showToast('Tap play to start audio'));
      document.getElementById('play-btn').textContent = '⏸';
      document.getElementById('player-art').classList.add('is-playing');
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    }

    function pausePlayback() {
      audio.pause();
      document.getElementById('play-btn').textContent = '▶';
      document.getElementById('player-art').classList.remove('is-playing');
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    }

    function togglePlay() {
      if (currentIndex === -1 && playlist.length) { loadTrack(0); return; }
      if (!playlist.length) { showToast('Add some music first'); return; }
      if (audio.paused) startPlayback(); else pausePlayback();
    }

    function playNext() {
      if (!playlist.length) return;
      currentIndex = isShuffle ? Math.floor(Math.random() * playlist.length) : (currentIndex + 1) % playlist.length;
      loadTrack(currentIndex);
    }

    function playPrev() {
      if (!playlist.length) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex);
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      document.getElementById('shuffle-btn').classList.toggle('active-toggle', isShuffle);
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      document.getElementById('repeat-btn').classList.toggle('active-toggle', isRepeat);
    }

    audio.addEventListener('ended', () => {
      if (isRepeat) { audio.currentTime = 0; audio.play(); }
      else playNext();
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        seekBar.value = pct;
        seekBar.style.setProperty('--fill', pct + '%');
        document.getElementById('time-current').textContent = formatTime(audio.currentTime);
        updatePositionState();
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      document.getElementById('time-total').textContent = formatTime(audio.duration);
    });

    seekBar.addEventListener('input', () => {
      if (audio.duration) audio.currentTime = (seekBar.value / 100) * audio.duration;
    });

    // ---------- Install prompt (Android/Chrome). iOS needs manual "Add to Home Screen". ----------
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
      if (!isStandalone) document.getElementById('install-row').style.display = 'block';
    });

    async function promptInstall() {
      if (!deferredInstallPrompt) {
        showToast('Use your browser menu → "Add to Home Screen" to install');
        return;
      }
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      document.getElementById('install-row').style.display = 'none';
    }

    window.addEventListener('appinstalled', () => {
      showToast('Installed — lock-screen controls are now available');
      document.getElementById('install-row').style.display = 'none';
    });

    (function iosHint() {
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const isStandalone = window.navigator.standalone === true;
      if (isIOS && !isStandalone) {
        document.getElementById('install-row').style.display = 'block';
        document.getElementById('install-btn').textContent = 'Add to Home Screen for lock-screen controls';
      }
    })();
  </script>
</body>
</html>
