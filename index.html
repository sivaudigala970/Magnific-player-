<!DOCTYPE html>
<html lang="en" data-theme="dark" data-style="ios-glass" data-accent="purple">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Magnific Player Pro</title>

  <link rel="manifest" id="manifest-placeholder" />
  <meta name="theme-color" content="#0b0b0d" id="theme-color-meta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- ID3 Tag Reader CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <style>
    :root {
      --bg: #0a0b0e;
      --card-bg: rgba(22, 24, 30, 0.78);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --subtext: #9a9ab0;
      --glass-btn: rgba(255, 255, 255, 0.08);
      --glass-btn-hover: rgba(255, 255, 255, 0.16);
      
      /* Color Accents */
      --accent-purple: #8b5cf6;
      --accent-crimson: #ff3b5c;
      --accent-emerald: #10b981;
      --accent-gold: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent: var(--accent-purple);
      
      --radius-card: 32px;
      --radius-art: 22px;
    }

    [data-theme="light"] {
      --bg: #eef1f6;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --text: #111215;
      --subtext: #686b75;
      --glass-btn: rgba(0, 0, 0, 0.05);
      --glass-btn-hover: rgba(0, 0, 0, 0.12);
    }

    [data-accent="purple"] { --accent: var(--accent-purple); }
    [data-accent="crimson"] { --accent: var(--accent-crimson); }
    [data-accent="emerald"] { --accent: var(--accent-emerald); }
    [data-accent="gold"] { --accent: var(--accent-gold); }
    [data-accent="cyan"] { --accent: var(--accent-cyan); }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.3s ease, color 0.3s ease;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Top Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 10;
    }

    .glass-btn {
      background: var(--glass-btn);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      width: 44px;
      height: 44px;
      font-size: 18px;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .glass-btn:active { transform: scale(0.9); background: var(--glass-btn-hover); }

    /* Main Container */
    .main-player {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      touch-action: pan-y;
    }

    .player-card {
      width: 100%;
      max-width: 340px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-card);
      padding: 22px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      position: relative;
    }

    /* --- Template Presets --- */
    
    /* Template 1: iOS Glass (Image 1 & 3) */
    [data-style="ios-glass"] .player-card {
      padding: 22px;
    }
    [data-style="ios-glass"] .album-frame {
      width: 100%;
      aspect-ratio: 1;
      border-radius: var(--radius-art);
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    /* Template 2: Minimalist OLED Card (Image 2) */
    [data-style="minimal-dark"] .player-card {
      background: #000000;
      border: 1px solid #1f1f1f;
      border-radius: 36px;
    }
    [data-style="minimal-dark"] .album-frame {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 24px;
      background: #111111;
      margin-bottom: 20px;
    }

    /* Template 3: Spotify Fluid Canvas (Image 4) */
    [data-style="spotify"] .player-card {
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
    }
    [data-style="spotify"] .album-frame {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      margin-bottom: 24px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.4);
    }

    /* Template 4: Neumorphic Soft Slate */
    [data-style="neumorphic"] .player-card {
      background: var(--bg);
      border: none;
      box-shadow: 12px 12px 24px rgba(0, 0, 0, 0.4), -8px -8px 18px rgba(255, 255, 255, 0.03);
      border-radius: 36px;
    }
    [data-style="neumorphic"] .album-frame {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 24px;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.5), inset -4px -4px 8px rgba(255,255,255,0.02);
      margin-bottom: 20px;
    }

    /* Template 5: Retro Cyber Glow */
    [data-style="cyber"] .player-card {
      background: rgba(10, 10, 18, 0.9);
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px var(--accent);
      border-radius: 20px;
    }
    [data-style="cyber"] .album-frame {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1px solid var(--accent);
      margin-bottom: 20px;
    }

    .album-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .quote-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0,0,0,0.15));
    }

    .quote-text {
      font-size: 14px;
      font-weight: 600;
      font-style: italic;
      line-height: 1.4;
    }

    .track-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .track-title { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 13px; color: var(--subtext); margin-top: 2px; }

    /* Progress Bar */
    .progress-box { margin-bottom: 16px; }
    .progress-bar {
      width: 100%;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.15);
      outline: none;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--subtext);
      margin-top: 6px;
    }

    /* Controls */
    .controls-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 8px;
    }

    .ctrl-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .ctrl-btn:active { transform: scale(0.85); }

    .play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }

    /* Mode Status Badge */
    .mode-indicator {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 4px;
      min-height: 16px;
    }

    /* Equalizer Soundbars */
    .soundbars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
      justify-content: center;
      margin-top: 10px;
    }

    .bar {
      width: 3px;
      background: var(--accent);
      height: 4px;
      border-radius: 2px;
      transition: height 0.1s ease;
    }

    .soundbars.playing .bar {
      animation: pulse 0.6s infinite alternate ease-in-out;
    }
    .soundbars.playing .bar:nth-child(2n) { animation-delay: 0.2s; }
    .soundbars.playing .bar:nth-child(3n) { animation-delay: 0.4s; }

    @keyframes pulse { 0% { height: 4px; } 100% { height: 18px; } }

    /* Drawer Side Menu */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 90;
      display: none;
    }
    .drawer-overlay.open { display: block; }

    .drawer-left {
      position: fixed;
      top: 0;
      left: -100%;
      width: 82%;
      max-width: 320px;
      height: 100%;
      background: var(--bg);
      border-right: 1px solid var(--card-border);
      z-index: 100;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .drawer-left.open { left: 0; }

    .nav-tabs { display: flex; gap: 8px; margin: 16px 0; }
    .tab-btn {
      background: var(--glass-btn);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 12px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }

    .list-container { flex: 1; overflow-y: auto; }
    .group-header {
      font-size: 13px;
      font-weight: 700;
      padding: 10px 0 4px 0;
      color: var(--accent);
      border-bottom: 1px solid var(--card-border);
    }
    .list-item {
      padding: 10px 0 10px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
    }

    /* Bottom Floating Action Switch Menu */
    .floating-settings-btn {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: 20px;
      z-index: 120;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .floating-settings-btn:active { transform: scale(0.9); }

    .bottom-sheet {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      background: var(--bg);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border-top: 1px solid var(--card-border);
      z-index: 110;
      padding: 24px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
      box-shadow: 0 -15px 35px rgba(0,0,0,0.5);
      transition: bottom 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bottom-sheet.open { bottom: 0; }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 16px;
    }

    .setting-label { font-size: 12px; color: var(--subtext); margin-bottom: 6px; text-transform: uppercase; }
    .option-select {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      background: var(--glass-btn);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .color-picker-row {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }

    .color-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }

    .color-dot:active { transform: scale(0.9); }
    .color-dot.active { border-color: var(--text); }

    #folder-input { display: none; }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <button class="glass-btn" onclick="toggleLibrary()" aria-label="Library">☰</button>
    <button class="glass-btn" onclick="document.getElementById('folder-input').click()" aria-label="Open Folder">📁</button>
  </header>

  <!-- Main Player Display -->
  <main class="main-player" id="swipe-area">
    <div class="player-card">
      <div class="album-frame">
        <img id="player-art" class="album-art" alt="Cover" />
        <div id="quote-container" class="quote-box">
          <div class="quote-text" id="quote-text">"Where words fail, music speaks."</div>
        </div>
      </div>

      <div class="track-info">
        <div style="overflow: hidden; padding-right: 8px;">
          <div class="track-title" id="player-title">No Track Loaded</div>
          <div class="track-artist" id="player-artist">Tap 📁 to choose music</div>
        </div>
        <button class="ctrl-btn" id="fav-btn" onclick="toggleFav()">☆</button>
      </div>

      <div class="progress-box">
        <input type="range" class="progress-bar" id="seek-bar" value="0" max="100" />
        <div class="time-row">
          <span id="time-curr">0:00</span>
          <span id="time-dur">-0:00</span>
        </div>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn" onclick="playPrev()">⏮</button>
        <button class="ctrl-btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" onclick="playNext()">⏭</button>
        <button class="ctrl-btn" id="mode-btn" onclick="cyclePlaybackMode()">🔀</button>
      </div>

      <!-- Mode Label (Shuffle/Repeat Status) -->
      <div class="mode-indicator" id="mode-indicator">Mode: Normal</div>

      <div class="soundbars" id="soundbars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
    </div>
  </main>

  <!-- Left Library Drawer -->
  <div class="drawer-overlay" id="overlay" onclick="closeAllPanels()"></div>
  <div class="drawer-left" id="drawer-left">
    <h2>Library</h2>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="renderView('songs', this)">Songs</button>
      <button class="tab-btn" onclick="renderView('albums', this)">Albums</button>
      <button class="tab-btn" onclick="renderView('artists', this)">Artists</button>
    </div>
    <div class="list-container" id="list-container">
      <div style="font-size:12px; color:var(--subtext); padding-top:10px;">No music loaded yet.</div>
    </div>
  </div>

  <!-- Bottom Floating Switch Button -->
  <button class="floating-settings-btn" onclick="toggleBottomSheet()" aria-label="Settings">⚙</button>

  <!-- Bottom Sheet Popup Options -->
  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-header">
      <span>App Customization</span>
      <button class="glass-btn" style="width:32px; height:32px; font-size:14px;" onclick="toggleBottomSheet()">✕</button>
    </div>

    <div>
      <div class="setting-label">Appearance Theme</div>
      <select class="option-select" onchange="setTheme(this.value)">
        <option value="dark">Dark Theme</option>
        <option value="light">Light Theme</option>
      </select>
    </div>

    <div>
      <div class="setting-label">Player Layout Template</div>
      <select class="option-select" onchange="setStyle(this.value)">
        <option value="ios-glass">iOS Glass Card (Image 1 & 3)</option>
        <option value="minimal-dark">Minimalist OLED Card (Image 2)</option>
        <option value="spotify">Spotify Fluid Canvas (Image 4)</option>
        <option value="neumorphic">Neumorphic Soft Slate</option>
        <option value="cyber">Retro Cyber Glow</option>
      </select>
    </div>

    <div>
      <div class="setting-label">Custom Accent Color</div>
      <div class="color-picker-row">
        <div class="color-dot active" style="background:#8b5cf6;" onclick="setAccent('purple', this)"></div>
        <div class="color-dot" style="background:#ff3b5c;" onclick="setAccent('crimson', this)"></div>
        <div class="color-dot" style="background:#10b981;" onclick="setAccent('emerald', this)"></div>
        <div class="color-dot" style="background:#f59e0b;" onclick="setAccent('gold', this)"></div>
        <div class="color-dot" style="background:#06b6d4;" onclick="setAccent('cyan', this)"></div>
      </div>
    </div>
  </div>

  <input type="file" id="folder-input" webkitdirectory directory multiple accept="audio/*" />
  <audio id="audio-player"></audio>

  <script>
    const quotes = [
      "\"Where words fail, music speaks.\"",
      "\"One good thing about music, when it hits you, you feel no pain.\"",
      "\"Turn your passion into power.\"",
      "\"Music cleanses the soul from everyday life.\"",
      "\"Stay hungry, stay foolish.\""
    ];

    let playlist = [];
    let currentIndex = -1;
    
    // Playback Modes: 0 = Normal, 1 = Shuffle, 2 = Repeat 1, 3 = Repeat All
    let playbackMode = 0; 
    const modeLabels = ["Mode: Normal", "Mode: Shuffle", "Mode: Repeat Single", "Mode: Repeat All"];
    const modeIcons = ["➡️", "🔀", "🔂", "🔁"];

    const audio = document.getElementById('audio-player');
    const seekBar = document.getElementById('seek-bar');
    const soundbars = document.getElementById('soundbars');

    // Service Worker for Offline Functionality
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // --- IndexedDB Local Track Storage ---
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('MusicStorageDB', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('tracks', { keyPath: 'id' });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveTrackToDB(track) {
      const db = await openDB();
      const tx = db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').put(track);
    }

    async function loadStoredTracks() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('tracks', 'readonly');
        const req = tx.objectStore('tracks').getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const saved = await loadStoredTracks();
      if (saved.length > 0) {
        playlist = saved.map(t => ({ ...t, url: URL.createObjectURL(t.blob) }));
        renderView('songs');
        loadTrack(0, false);
      }
    });

    document.getElementById('folder-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('audio/'));
      if (!files.length) return;

      playlist = [];
      for (let file of files) {
        const trackObj = {
          id: file.name + "_" + file.size,
          title: file.name.replace(/\.[^/.]+$/, ""),
          artist: "Unknown Artist",
          album: "Unknown Album",
          blob: file,
          art: null
        };

        // Extract ID3 Metadata
        if (window.jsmediatags) {
          window.jsmediatags.read(file, {
            onSuccess: function(tag) {
              if (tag.tags.title) trackObj.title = tag.tags.title;
              if (tag.tags.artist) trackObj.artist = tag.tags.artist;
              if (tag.tags.album) trackObj.album = tag.tags.album;
              if (tag.tags.picture) {
                const { data, format } = tag.tags.picture;
                let base64String = "";
                for (let i = 0; i < data.length; i++) base64String += String.fromCharCode(data[i]);
                trackObj.art = `data:${format};base64,${window.btoa(base64String)}`;
              }
            }
          });
        }

        await saveTrackToDB(trackObj);
        trackObj.url = URL.createObjectURL(file);
        playlist.push(trackObj);
      }
      renderView('songs');
      if (playlist.length) loadTrack(0, false);
    });

    // --- UI Controls & Sheet Toggle ---
    function toggleLibrary() {
      closeAllPanels();
      document.getElementById('drawer-left').classList.add('open');
      document.getElementById('overlay').classList.add('open');
    }

    function toggleBottomSheet() {
      const sheet = document.getElementById('bottom-sheet');
      const isOpen = sheet.classList.contains('open');
      closeAllPanels();
      if (!isOpen) {
        sheet.classList.add('open');
        document.getElementById('overlay').classList.add('open');
      }
    }

    function closeAllPanels() {
      document.getElementById('drawer-left').classList.remove('open');
      document.getElementById('bottom-sheet').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    }

    function setTheme(theme) { document.documentElement.setAttribute('data-theme', theme); }
    function setStyle(style) { document.documentElement.setAttribute('data-style', style); }
    function setAccent(accent, el) {
      document.documentElement.setAttribute('data-accent', accent);
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    function toggleFav() {
      const btn = document.getElementById('fav-btn');
      btn.innerText = btn.innerText === '☆' ? '★' : '☆';
    }

    // --- Unified Mode Toggle ---
    function cyclePlaybackMode() {
      playbackMode = (playbackMode + 1) % 4;
      document.getElementById('mode-btn').innerText = modeIcons[playbackMode];
      document.getElementById('mode-indicator').innerText = modeLabels[playbackMode];
    }

    // --- Library Rendering ---
    function renderView(type, btn) {
      if (btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }

      const container = document.getElementById('list-container');
      if (!playlist.length) return;

      if (type === 'songs') {
        container.innerHTML = playlist.map((t, i) => `
          <div class="list-item" onclick="loadTrack(${i}); closeAllPanels();">
            <div style="font-weight:600; font-size:14px;">${t.title}</div>
            <div style="font-size:12px; color:var(--subtext);">${t.artist}</div>
          </div>
        `).join('');
      } else {
        const key = type === 'albums' ? 'album' : 'artist';
        const groups = {};
        playlist.forEach((t, idx) => {
          const name = t[key] || `Unknown ${key}`;
          if (!groups[name]) groups[name] = [];
          groups[name].push({ ...t, originalIndex: idx });
        });

        container.innerHTML = Object.keys(groups).map(groupName => `
          <div class="group-header">${groupName} (${groups[groupName].length})</div>
          ${groups[groupName].map(t => `
            <div class="list-item" onclick="loadTrack(${t.originalIndex}); closeAllPanels();">
              <div style="font-weight:600; font-size:13px;">${t.title}</div>
            </div>
          `).join('')}
        `).join('');
      }
    }

    // Swipe Support
    let touchStartX = 0;
    const swipeArea = document.getElementById('swipe-area');
    swipeArea.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
    swipeArea.addEventListener('touchend', e => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) playNext();
      if (touchEndX > touchStartX + 50) playPrev();
    });

    // --- Audio Logic ---
    function loadTrack(index, autoPlay = true) {
      currentIndex = index;
      const track = playlist[currentIndex];
      audio.src = track.url;
      document.getElementById('player-title').innerText = track.title;
      document.getElementById('player-artist').innerText = track.artist;

      const artImg = document.getElementById('player-art');
      const quoteBox = document.getElementById('quote-container');

      if (track.art) {
        artImg.src = track.art;
        artImg.style.display = 'block';
        quoteBox.style.display = 'none';
      } else {
        artImg.style.display = 'none';
        quoteBox.style.display = 'flex';
        document.getElementById('quote-text').innerText = quotes[Math.floor(Math.random() * quotes.length)];
      }

      if (autoPlay) {
        audio.play();
        document.getElementById('play-btn').innerText = '⏸';
        soundbars.classList.add('playing');
      }
    }

    function togglePlay() {
      if (currentIndex === -1 && playlist.length) loadTrack(0);
      if (audio.paused) {
        audio.play();
        document.getElementById('play-btn').innerText = '⏸';
        soundbars.classList.add('playing');
      } else {
        audio.pause();
        document.getElementById('play-btn').innerText = '▶';
        soundbars.classList.remove('playing');
      }
    }

    function playNext() {
      if (!playlist.length) return;
      if (playbackMode === 1) { // Shuffle
        currentIndex = Math.floor(Math.random() * playlist.length);
      } else {
        currentIndex = (currentIndex + 1) % playlist.length;
      }
      loadTrack(currentIndex);
    }

    function playPrev() {
      if (!playlist.length) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex);
    }

    audio.addEventListener('ended', () => {
      if (playbackMode === 2) { // Repeat Single
        audio.currentTime = 0;
        audio.play();
      } else {
        playNext();
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        document.getElementById('time-curr').innerText = formatTime(audio.currentTime);
        document.getElementById('time-dur').innerText = "-" + formatTime(audio.duration - audio.currentTime);
      }
    });

    seekBar.addEventListener('input', () => {
      if (audio.duration) audio.currentTime = (seekBar.value / 100) * audio.duration;
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
  </script>
</body>
</html>
