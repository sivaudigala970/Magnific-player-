<!DOCTYPE html>
<html lang="en" data-element="fire">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Magnific Music Player</title>

  <script>
    (function () {
      try {
        var e = localStorage.getItem('mp_element');
        var valid = ['fire','water','air','earth','sky'];
        if (e && valid.indexOf(e) !== -1) document.documentElement.setAttribute('data-element', e);
      } catch (err) {}
    })();
  </script>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0e0f14" id="theme-color-meta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Magnific" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- No external scripts, fonts, or CDN images — everything needed to run is in this
       folder (this file, sw.js, manifest.json, icons/), so the app works with zero
       network access once these files are on the device. -->

  <style>
    :root {
      --danger: #ff5f5f;
      --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
    }

    /* ============================================================
       Five elemental themes. Each defines its whole palette (so no
       separate dark/light switch is needed — every element already
       carries its own natural light or dark identity), plus its own
       body backdrop and its own shape/motion for the elemental
       progress bar further down.
       ============================================================ */

    [data-element="fire"] {
      --bg: #170b06; --bg-elevated: #26130a;
      --text: #fff3ea; --subtext: #c99b7d;
      --card-border: rgba(255,150,80,0.18);
      --glass-btn: rgba(255,140,60,0.08); --glass-btn-hover: rgba(255,140,60,0.18);
      --neu-dark: rgba(0,0,0,0.6); --neu-light: rgba(255,150,80,0.06);
      --accent: #ff7a1a; --accent-2: #ffd76b;
      --track-line: rgba(255,140,60,0.15);
    }
    [data-element="fire"] body {
      background: radial-gradient(ellipse at 50% 130%, #6e1f02 0%, #2c0f04 45%, #0c0603 100%);
    }

    [data-element="water"] {
      --bg: #071722; --bg-elevated: #0e2635;
      --text: #eaf7ff; --subtext: #8fb8cc;
      --card-border: rgba(120,200,230,0.16);
      --glass-btn: rgba(90,200,230,0.08); --glass-btn-hover: rgba(90,200,230,0.18);
      --neu-dark: rgba(0,0,0,0.55); --neu-light: rgba(140,210,235,0.05);
      --accent: #2fb8e6; --accent-2: #8fe9ff;
      --track-line: rgba(90,200,230,0.15);
    }
    [data-element="water"] body {
      background: radial-gradient(ellipse at 50% -10%, #114a63 0%, #0a2635 45%, #051119 100%);
    }

    [data-element="air"] {
      --bg: #eef5fb; --bg-elevated: #ffffff;
      --text: #1c2b36; --subtext: #5f7c8f;
      --card-border: rgba(30,60,90,0.08);
      --glass-btn: rgba(30,60,90,0.05); --glass-btn-hover: rgba(30,60,90,0.1);
      --neu-dark: rgba(160,180,200,0.5); --neu-light: rgba(255,255,255,0.95);
      --accent: #5aa9d6; --accent-2: #d8f0fc;
      --track-line: rgba(30,60,90,0.1);
    }
    [data-element="air"] body {
      background: linear-gradient(160deg, #eaf4fb 0%, #dcecf6 50%, #eef7fb 100%);
    }
    [data-element="air"] body::before, [data-element="air"] body::after {
      content: ''; position: fixed; border-radius: 50%; filter: blur(40px); opacity: 0.55; pointer-events: none; z-index: 0;
      background: radial-gradient(circle, #ffffff, transparent 70%);
    }
    [data-element="air"] body::before { width: 260px; height: 140px; top: 8%; left: -10%; animation: cloud-drift-1 42s ease-in-out infinite; }
    [data-element="air"] body::after { width: 220px; height: 120px; top: 55%; right: -15%; animation: cloud-drift-2 56s ease-in-out infinite; }
    @keyframes cloud-drift-1 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(60vw); } }
    @keyframes cloud-drift-2 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-50vw); } }

    [data-element="earth"] {
      --bg: #0f1a0d; --bg-elevated: #1a2a16;
      --text: #eef7e6; --subtext: #a8c39a;
      --card-border: rgba(140,200,100,0.15);
      --glass-btn: rgba(140,200,100,0.08); --glass-btn-hover: rgba(140,200,100,0.18);
      --neu-dark: rgba(0,0,0,0.55); --neu-light: rgba(160,210,120,0.05);
      --accent: #6fbf3f; --accent-2: #c7e88a;
      --track-line: rgba(140,200,100,0.15);
    }
    [data-element="earth"] body {
      background: radial-gradient(ellipse at 30% 0%, #24391a 0%, #16240f 50%, #0a1408 100%);
    }

    [data-element="sky"] {
      --bg: #171233; --bg-elevated: #241c47;
      --text: #f5f0ff; --subtext: #b6a9d9;
      --card-border: rgba(190,160,255,0.18);
      --glass-btn: rgba(190,160,255,0.08); --glass-btn-hover: rgba(190,160,255,0.18);
      --neu-dark: rgba(0,0,0,0.55); --neu-light: rgba(190,160,255,0.06);
      --accent: #a78bfa; --accent-2: #ffb4d0;
      --track-line: rgba(190,160,255,0.15);
    }
    [data-element="sky"] body {
      background: linear-gradient(160deg, #241854 0%, #4a2a6b 45%, #d97a5c 100%);
    }
    [data-element="sky"] body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(2px 2px at 15% 20%, #fff, transparent),
        radial-gradient(2px 2px at 75% 15%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 35% 35%, #fff, transparent),
        radial-gradient(2px 2px at 60% 45%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 85% 60%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 20% 65%, #fff, transparent),
        radial-gradient(2px 2px at 45% 12%, #fff, transparent);
      opacity: 0.7;
      animation: star-field-twinkle 3.5s ease-in-out infinite alternate;
    }
    @keyframes star-field-twinkle { 0% { opacity: 0.35; } 100% { opacity: 0.85; } }

    .scroll-container { position: relative; z-index: 1; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); transition: background 0.3s ease, color 0.3s ease; }

    .scroll-container {
      height: 100dvh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    .player-section, .library-section {
      min-height: 100dvh;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(16px + env(safe-area-inset-top)) 20px 12px;
    }

    .app-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }

    .neu-circle-btn {
      background: var(--bg);
      border: none;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      width: 42px;
      height: 42px;
      box-shadow: 5px 5px 12px var(--neu-dark), -5px -5px 12px var(--neu-light);
      transition: box-shadow 0.2s ease, transform 0.15s var(--ease-spring);
    }
    .neu-circle-btn:active {
      box-shadow: inset 3px 3px 8px var(--neu-dark), inset -3px -3px 8px var(--neu-light);
      transform: scale(0.92);
    }

    /* ---------- Player section ---------- */
    .player-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 26px 20px;
    }

    .album-frame {
      width: 100%;
      max-width: 270px;
      aspect-ratio: 1;
      margin: 0 auto 22px;
      border-radius: 26px;
      overflow: hidden;
      position: relative;
      background: var(--bg-elevated);
      box-shadow: 0 16px 34px rgba(0,0,0,0.35);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .album-frame::before {
      content: ''; position: absolute; inset: -26px; z-index: -1;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      opacity: 0.4; filter: blur(28px); pointer-events: none;
      transition: background 0.4s ease;
    }
    .album-art { width: 100%; height: 100%; object-fit: cover; display: none; }
    .album-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--subtext);
      opacity: 0.5;
    }

    .track-info { width: 100%; max-width: 300px; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .track-title { font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .track-artist { font-size: 13px; color: var(--subtext); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .fav-btn {
      width: 40px; height: 40px; border-radius: 14px;
      background: var(--bg); border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex: 0 0 auto; margin-left: 10px;
      box-shadow: 5px 5px 12px var(--neu-dark), -5px -5px 12px var(--neu-light);
      transition: box-shadow 0.2s ease, transform 0.15s var(--ease-spring);
    }
    .fav-btn:active { box-shadow: inset 3px 3px 8px var(--neu-dark), inset -3px -3px 8px var(--neu-light); transform: scale(0.92); }

    @keyframes fav-bounce {
      0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(-8deg); } 70% { transform: scale(0.92); } 100% { transform: scale(1); }
    }

    /* ============================================================
       Elemental progress bar — a real range input for interaction
       (kept, just made invisible) layered over two rows of themed
       shapes: a dim row always fully visible, and a bright animated
       row that reveals more of itself as the song plays.
       ============================================================ */
    .progress-box { width: 100%; max-width: 300px; margin-bottom: 14px; }
    .elemental-bar-wrap { position: relative; width: 100%; height: 20px; }
    .ep-row { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 3px; pointer-events: none; }
    .ep-dim { opacity: 1; }
    .ep-bright { width: 0%; overflow: hidden; transition: width 0.2s linear; }
    .ep-seg { flex: 1 0 auto; display: block; }
    .seek-bar {
      position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
      opacity: 0; cursor: pointer; -webkit-appearance: none; appearance: none; background: transparent;
    }
    .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; }

    /* The elemental animations (flicker/bob/drift/sway/twinkle) only run while a
       track is actually playing — otherwise they'd burn battery nonstop even
       when paused or idle, for a visual nobody's looking at. */
    .elemental-bar-wrap.is-playing .ep-bright .ep-seg { animation-play-state: running !important; }

    /* Fire: flame flicker */
    [data-element="fire"] .ep-seg { width: 6px; height: 15px; border-radius: 50% 50% 50% 0; transform: rotate(315deg); }
    [data-element="fire"] .ep-dim .ep-seg { background: linear-gradient(#3a2418, #23140c); opacity: 0.6; }
    [data-element="fire"] .ep-bright .ep-seg {
      background: linear-gradient(#ffe08a, #ff8a1f 55%, #ff3d00);
      box-shadow: 0 0 6px rgba(255,120,20,0.75);
      animation: flame-flicker 850ms ease-in-out infinite alternate; animation-play-state: paused;
      animation-delay: calc(var(--i, 0) * 65ms);
    }
    @keyframes flame-flicker { 0% { transform: rotate(315deg) scaleY(0.8); } 100% { transform: rotate(315deg) scaleY(1.2); } }

    /* Water: bobbing droplets */
    [data-element="water"] .ep-seg { width: 7px; height: 9px; border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%; }
    [data-element="water"] .ep-dim .ep-seg { background: rgba(90,150,180,0.35); }
    [data-element="water"] .ep-bright .ep-seg {
      background: linear-gradient(#d3f5ff, #2fb8e6 60%, #0e6ba8);
      box-shadow: 0 0 6px rgba(47,184,230,0.65);
      animation: water-bob 1300ms ease-in-out infinite alternate; animation-play-state: paused;
      animation-delay: calc(var(--i, 0) * 85ms);
    }
    @keyframes water-bob { 0% { transform: translateY(3px); } 100% { transform: translateY(-4px); } }

    /* Air: drifting wisps */
    [data-element="air"] .ep-seg { width: 9px; height: 4px; border-radius: 4px; }
    [data-element="air"] .ep-dim .ep-seg { background: rgba(60,90,120,0.25); }
    [data-element="air"] .ep-bright .ep-seg {
      background: linear-gradient(90deg, #ffffff, #bfe3f7);
      box-shadow: 0 0 5px rgba(90,150,190,0.6);
      animation: air-drift 1500ms ease-in-out infinite alternate; animation-play-state: paused;
      animation-delay: calc(var(--i, 0) * 55ms);
    }
    @keyframes air-drift { 0% { transform: translateX(-2px) scaleX(0.85); opacity: 0.65; } 100% { transform: translateX(2px) scaleX(1.15); opacity: 1; } }

    /* Earth: swaying grass */
    [data-element="earth"] .ep-seg { width: 4px; height: 16px; border-radius: 3px 3px 0 0; transform-origin: bottom center; }
    [data-element="earth"] .ep-dim .ep-seg { background: linear-gradient(#4a3b28, #2e2417); opacity: 0.65; }
    [data-element="earth"] .ep-bright .ep-seg {
      background: linear-gradient(#c8f08a, #4c9a2a);
      box-shadow: 0 0 5px rgba(76,154,42,0.55);
      animation: grass-sway 1700ms ease-in-out infinite alternate; animation-play-state: paused;
      animation-delay: calc(var(--i, 0) * 75ms);
    }
    @keyframes grass-sway { 0% { transform: rotate(-7deg); } 100% { transform: rotate(7deg); } }

    /* Sky: twinkling stars */
    [data-element="sky"] .ep-seg { width: 5px; height: 5px; border-radius: 50%; margin-bottom: 5px; }
    [data-element="sky"] .ep-dim .ep-seg { background: rgba(190,170,230,0.3); }
    [data-element="sky"] .ep-bright .ep-seg {
      background: #fff8e7;
      box-shadow: 0 0 8px rgba(255,248,231,0.9);
      animation: star-twinkle 1200ms ease-in-out infinite alternate; animation-play-state: paused;
      animation-delay: calc(var(--i, 0) * 95ms);
    }
    @keyframes star-twinkle { 0% { opacity: 0.4; transform: scale(0.7); } 100% { opacity: 1; transform: scale(1.3); } }

    .time-row { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--subtext); margin-top: 8px; font-variant-numeric: tabular-nums; }

    .controls-primary {
      width: 100%; max-width: 260px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .ctrl-btn-lg {
      background: none; border: none; color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; opacity: 0.9;
    }
    .ctrl-btn-lg:active { transform: scale(0.88); }
    .play-btn {
      width: 62px; height: 62px; border-radius: 50%;
      background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 22px rgba(0,0,0,0.35), 0 0 18px var(--accent);
      cursor: pointer;
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }
    .play-btn:active { transform: scale(0.9); }

    .controls-secondary { width: 100%; max-width: 300px; display: flex; justify-content: center; gap: 30px; margin-bottom: 18px; }
    .ctrl-btn-sm {
      background: none; border: none; color: var(--subtext); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; opacity: 0.75;
      transition: color 0.2s ease, opacity 0.2s ease;
    }
    .ctrl-btn-sm:active { transform: scale(0.85); }
    .ctrl-btn-sm.active-glow { color: var(--accent); opacity: 1; filter: drop-shadow(0 0 5px var(--accent)); }

    .volume-row { width: 100%; max-width: 300px; display: flex; align-items: center; gap: 10px; color: var(--subtext); }
    .volume-slider {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 3px; border-radius: 3px;
      background: linear-gradient(to right, var(--text) var(--vfill, 80%), var(--track-line) var(--vfill, 80%));
      outline: none;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--text); cursor: pointer;
    }

    .scroll-hint {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
      cursor: pointer; color: var(--subtext);
    }
    .scroll-hint svg { animation: bounce-hint 1.7s ease-in-out infinite; }
    @keyframes bounce-hint { 0%, 100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(7px); opacity: 1; } }
    .scroll-hint span { font-size: 10.5px; letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.6; }

    /* ---------- Library section ---------- */
    .library-header { padding: calc(20px + env(safe-area-inset-top)) 20px 4px; }
    .library-header h2 { font-size: 20px; letter-spacing: -0.3px; margin-bottom: 12px; }

    .search-input {
      width: 100%; padding: 11px 14px; border-radius: 14px; border: none;
      background: var(--bg); color: var(--text); font-size: 13px;
      box-shadow: inset 3px 3px 8px var(--neu-dark), inset -3px -3px 8px var(--neu-light);
    }
    .search-input::placeholder { color: var(--subtext); }

    .nav-tabs { display: flex; gap: 8px; margin: 14px 0; overflow-x: auto; padding: 4px 20px 8px; scrollbar-width: none; }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 0 0 auto; white-space: nowrap; background: var(--bg); border: none;
      padding: 8px 14px; border-radius: 13px; color: var(--subtext); font-size: 12px; font-weight: 600; cursor: pointer;
      box-shadow: 4px 4px 10px var(--neu-dark), -4px -4px 10px var(--neu-light);
      transition: box-shadow 0.2s ease, color 0.25s ease, transform 0.15s var(--ease-spring);
    }
    .tab-btn:active { box-shadow: inset 3px 3px 8px var(--neu-dark), inset -3px -3px 8px var(--neu-light); transform: scale(0.94); }
    .tab-btn.active { color: var(--accent); box-shadow: 4px 4px 10px var(--neu-dark), -4px -4px 10px var(--neu-light), 0 0 0 1.5px var(--accent) inset; }

    .list-container { flex: 1; overflow-y: auto; padding: 0 20px calc(90px + env(safe-area-inset-bottom)); }

    @keyframes fade-slide-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .group-header { font-size: 13px; font-weight: 700; padding: 12px 0 4px; color: var(--accent); border-bottom: 1px solid var(--card-border); }

    .list-item {
      padding: 12px 4px; border-bottom: 1px solid rgba(128,128,128,0.08); cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      transition: background 0.15s ease, transform 0.15s var(--ease-spring);
      animation: fade-slide-in 0.25s ease backwards; border-radius: 10px;
    }
    .list-item:active { background: var(--glass-btn-hover); transform: scale(0.98); }
    .list-item.now-playing .li-title { color: var(--accent); }

    .row-delete-btn {
      width: 26px; height: 26px; border-radius: 50%; background: var(--glass-btn); border: none; color: var(--subtext);
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto; margin-left: 8px;
      transition: background 0.15s ease, transform 0.15s var(--ease-spring), color 0.15s ease;
    }
    .row-delete-btn:active {
