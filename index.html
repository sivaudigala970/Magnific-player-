<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Minimal Music Player</title>
  
  <link rel="manifest" id="manifest-placeholder" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --subtext: #666666;
      --card-bg: #f8f8f8;
      --border: #e0e0e0;
      --bar: #000000;
    }

    [data-theme="dark"] {
      --bg: #121212;
      --text: #ffffff;
      --subtext: #a0a0a0;
      --card-bg: #1e1e1e;
      --border: #333333;
      --bar: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.3s, color 0.3s;
    }

    /* Top Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 10;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text);
      cursor: pointer;
    }

    /* Main Fullscreen Player */
    .main-player {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      touch-action: pan-y;
    }

    .album-frame {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1;
      border: 3px solid var(--text);
      border-radius: 28px;
      overflow: hidden;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .album-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-meta {
      width: 100%;
      max-width: 320px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .track-meta .details { overflow: hidden; padding-right: 12px; }
    .track-title { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 13px; color: var(--subtext); margin-top: 2px; }

    /* Progress Slider */
    .progress-box {
      width: 100%;
      max-width: 320px;
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 100%;
      -webkit-appearance: none;
      height: 3px;
      background: var(--border);
      outline: none;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
    }

    /* Controls */
    .controls-row {
      width: 100%;
      max-width: 320px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--text);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* Minimal Visualizer Soundbars */
    .soundbars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 30px;
      margin-top: 10px;
    }

    .bar {
      width: 3px;
      background: var(--bar);
      height: 4px;
      border-radius: 2px;
      transition: height 0.1s ease;
    }

    .soundbars.playing .bar {
      animation: pulse 0.6s infinite alternate ease-in-out;
    }

    .soundbars.playing .bar:nth-child(2n) { animation-delay: 0.2s; }
    .soundbars.playing .bar:nth-child(3n) { animation-delay: 0.4s; }

    @keyframes pulse {
      0% { height: 4px; }
      100% { height: 28px; }
    }

    /* Slide Drawer Menu (Albums / Artists / Songs) */
    .drawer {
      position: fixed;
      top: 0;
      left: -100%;
      width: 80%;
      max-width: 340px;
      height: 100%;
      background: var(--bg);
      border-right: 1px solid var(--border);
      z-index: 100;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .drawer.open { left: 0; }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 90;
      display: none;
    }

    .drawer-overlay.open { display: block; }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin: 16px 0;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 12px;
      color: var(--text);
      font-size: 12px;
    }

    .tab-btn.active {
      background: var(--text);
      color: var(--bg);
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
    }

    .list-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    #folder-input { display: none; }
  </style>
</head>
<body>

  <!-- Header Controls -->
  <header>
    <button class="icon-btn" onclick="toggleDrawer()">☰</button>
    <div style="display: flex; gap: 12px;">
      <button class="icon-btn" onclick="selectFolder()">📁</button>
      <button class="icon-btn" onclick="toggleTheme()">☯</button>
    </div>
  </header>

  <!-- Main Screen Player -->
  <main class="main-player" id="swipe-area">
    <div class="album-frame">
      <img id="player-art" class="album-art" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%23222'/></svg>" alt="Cover" />
    </div>

    <div class="track-meta">
      <div class="details">
        <div class="track-title" id="player-title">No Track Selected</div>
        <div class="track-artist" id="player-artist">Tap 📁 to load library</div>
      </div>
      <button class="icon-btn" id="fav-btn" onclick="this.innerText = this.innerText==='♡'?'♥':'♡'">♡</button>
    </div>

    <div class="progress-box">
      <input type="range" class="progress-bar" id="seek-bar" value="0" max="100" />
    </div>

    <div class="controls-row">
      <button class="icon-btn" id="shuffle-btn" onclick="toggleShuffle()">🔀</button>
      <button class="icon-btn" onclick="playPrev()">⏮</button>
      <button class="icon-btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
      <button class="icon-btn" onclick="playNext()">⏭</button>
      <button class="icon-btn" id="repeat-btn" onclick="toggleRepeat()">🔁</button>
    </div>

    <!-- Minimal Animated Soundbars -->
    <div class="soundbars" id="soundbars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
  </main>

  <!-- Side Drawer (Albums / Artists / Songs) -->
  <div class="drawer-overlay" id="overlay" onclick="toggleDrawer()"></div>
  <div class="drawer" id="drawer">
    <h2>Library</h2>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="renderView('songs', this)">Songs</button>
      <button class="tab-btn" onclick="renderView('albums', this)">Albums</button>
      <button class="tab-btn" onclick="renderView('artists', this)">Artists</button>
    </div>
    <div class="list-container" id="list-container">
      <div style="font-size:12px; color:var(--subtext);">Select a music folder to begin.</div>
    </div>
  </div>

  <input type="file" id="folder-input" webkitdirectory directory multiple accept="audio/*" />
  <audio id="audio-player"></audio>

  <script>
    let playlist = [];
    let currentIndex = -1;
    let isShuffle = false;
    let isRepeat = false;
    let dirHandle = null;

    const audio = document.getElementById('audio-player');
    const seekBar = document.getElementById('seek-bar');
    const soundbars = document.getElementById('soundbars');

    // --- IndexedDB Setup for Persistent Folder Handle Access ---
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('MusicPlayerDB', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('settings');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveDirectoryHandle(handle) {
      const db = await openDB();
      const tx = db.transaction('settings', 'readwrite');
      tx.objectStore('settings').put(handle, 'folderHandle');
    }

    async function getDirectoryHandle() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('settings', 'readonly');
        const req = tx.objectStore('settings').get('folderHandle');
        req.onsuccess = () => resolve(req.result);
      });
    }

    // Initialize & Rescan
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        dirHandle = await getDirectoryHandle();
        if (dirHandle) {
          if ((await dirHandle.queryPermission({ mode: 'read' })) === 'granted') {
            await rescanFolder(dirHandle);
          }
        }
      } catch (e) { console.log("Persistent folder access not supported or allowed yet."); }
    });

    async function selectFolder() {
      if ('showDirectoryPicker' in window) {
        try {
          dirHandle = await window.showDirectoryPicker();
          await saveDirectoryHandle(dirHandle);
          await rescanFolder(dirHandle);
        } catch (e) { console.log(e); }
      } else {
        document.getElementById('folder-input').click();
      }
    }

    // Standard input fallback
    document.getElementById('folder-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('audio/'));
      processFiles(files);
    });

    async function rescanFolder(handle) {
      const files = [];
      for await (const entry of handle.values()) {
        if (entry.kind === 'file') {
          const file = await entry.getFile();
          if (file.type.startsWith('audio/')) files.push(file);
        }
      }
      processFiles(files);
    }

    function processFiles(files) {
      playlist = files.map(file => ({
        file: file,
        title: file.name.replace(/\.[^/.]+$/, ""),
        artist: "Unknown Artist",
        album: "Unknown Album",
        url: URL.createObjectURL(file),
        art: null
      }));
      renderView('songs');
      if(playlist.length > 0 && currentIndex === -1) loadTrack(0, false);
    }

    // --- UI Controls & Views ---
    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    function renderView(type, btn) {
      if (btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }

      const container = document.getElementById('list-container');
      if (playlist.length === 0) return;

      if (type === 'songs') {
        container.innerHTML = playlist.map((t, i) => `
          <div class="list-item" onclick="loadTrack(${i}); toggleDrawer();">
            <div style="font-weight:600; font-size:14px;">${t.title}</div>
            <div style="font-size:12px; color:var(--subtext);">${t.artist}</div>
          </div>
        `).join('');
      } else {
        const key = type === 'albums' ? 'album' : 'artist';
        const groups = {};
        playlist.forEach(t => {
          const name = t[key] || `Unknown ${key}`;
          groups[name] = (groups[name] || 0) + 1;
        });

        container.innerHTML = Object.keys(groups).map(g => `
          <div class="list-item">
            <div style="font-weight:600; font-size:14px;">${g}</div>
            <div style="font-size:12px; color:var(--subtext);">${groups[g]} tracks</div>
          </div>
        `).join('');
      }
    }

    // --- Swipe Support ---
    let touchStartX = 0;
    const swipeArea = document.getElementById('swipe-area');

    swipeArea.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    });

    swipeArea.addEventListener('touchend', e => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) playNext(); // Swipe Left -> Next
      if (touchEndX > touchStartX + 50) playPrev(); // Swipe Right -> Prev
    });

    // --- Audio Logic ---
    function loadTrack(index, autoPlay = true) {
      currentIndex = index;
      const track = playlist[currentIndex];
      audio.src = track.url;
      document.getElementById('player-title').innerText = track.title;
      document.getElementById('player-artist').innerText = track.artist;
      
      if (autoPlay) {
        audio.play();
        document.getElementById('play-btn').innerText = '⏸';
        soundbars.classList.add('playing');
      }
    }

    function togglePlay() {
      if (currentIndex === -1 && playlist.length > 0) loadTrack(0);
      if (audio.paused) {
        audio.play();
        document.getElementById('play-btn').innerText = '⏸';
        soundbars.classList.add('playing');
      } else {
        audio.pause();
        document.getElementById('play-btn').innerText = '▶';
        soundbars.classList.remove('playing');
      }
    }

    function playNext() {
      if (!playlist.length) return;
      currentIndex = isShuffle ? Math.floor(Math.random() * playlist.length) : (currentIndex + 1) % playlist.length;
      loadTrack(currentIndex);
    }

    function playPrev() {
      if (!playlist.length) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex);
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      document.getElementById('shuffle-btn').style.opacity = isShuffle ? "1" : "0.4";
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      document.getElementById('repeat-btn').style.opacity = isRepeat ? "1" : "0.4";
    }

    audio.addEventListener('ended', () => {
      if (isRepeat) { audio.currentTime = 0; audio.play(); }
      else playNext();
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        seekBar.value = (audio.currentTime / audio.duration) * 100;
      }
    });

    seekBar.addEventListener('input', () => {
      if (audio.duration) audio.currentTime = (seekBar.value / 100) * audio.duration;
    });
  </script>
</body>
</html>
