<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Minimal Music Player</title>
  
  <link rel="manifest" id="manifest-placeholder" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <style>
    :root {
      --bg: #121212;
      --text: #ffffff;
      --subtext: #aaaaaa;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-btn-hover: rgba(255, 255, 255, 0.25);
      --bar: #ffffff;
    }

    [data-theme="light"] {
      --bg: #f4f4f6;
      --text: #1a1a1a;
      --subtext: #666666;
      --glass-bg: rgba(0, 0, 0, 0.05);
      --glass-border: rgba(0, 0, 0, 0.12);
      --glass-btn-hover: rgba(0, 0, 0, 0.15);
      --bar: #1a1a1a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.3s, color 0.3s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 10;
    }

    /* Glassmorphism Buttons */
    .glass-btn {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .glass-btn:active {
      transform: scale(0.92);
      background: var(--glass-btn-hover);
    }

    .icon-nav {
      width: 42px;
      height: 42px;
      font-size: 18px;
    }

    .main-player {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      touch-action: pan-y;
    }

    /* Album Cover & Quote Container */
    .album-frame {
      width: 100%;
      max-width: 300px;
      aspect-ratio: 1;
      border-radius: 28px;
      overflow: hidden;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }

    .album-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .quote-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0,0,0,0.1));
    }

    .quote-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      font-style: italic;
    }

    .track-meta {
      width: 100%;
      max-width: 300px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .track-meta .details { overflow: hidden; padding-right: 12px; }
    .track-title { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 13px; color: var(--subtext); margin-top: 2px; }

    .progress-box {
      width: 100%;
      max-width: 300px;
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 100%;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 4px;
      background: var(--glass-border);
      outline: none;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
    }

    /* Transparent Highlight Controls Layout */
    .controls-row {
      width: 100%;
      max-width: 300px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .ctrl-btn {
      width: 48px;
      height: 48px;
      font-size: 18px;
    }

    .play-btn {
      width: 60px;
      height: 60px;
      font-size: 24px;
      background: var(--text);
      color: var(--bg);
      border: none;
    }

    /* Soundbars */
    .soundbars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 24px;
      margin-top: 8px;
    }

    .bar {
      width: 3px;
      background: var(--bar);
      height: 4px;
      border-radius: 2px;
      transition: height 0.1s ease;
    }

    .soundbars.playing .bar {
      animation: pulse 0.6s infinite alternate ease-in-out;
    }

    .soundbars.playing .bar:nth-child(2n) { animation-delay: 0.2s; }
    .soundbars.playing .bar:nth-child(3n) { animation-delay: 0.4s; }

    @keyframes pulse {
      0% { height: 4px; }
      100% { height: 24px; }
    }

    /* Drawer Menu */
    .drawer {
      position: fixed;
      top: 0;
      left: -100%;
      width: 80%;
      max-width: 320px;
      height: 100%;
      background: var(--bg);
      border-right: 1px solid var(--glass-border);
      z-index: 100;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .drawer.open { left: 0; }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 90;
      display: none;
    }

    .drawer-overlay.open { display: block; }

    .nav-tabs { display: flex; gap: 8px; margin: 16px 0; }

    .tab-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 6px 14px;
      border-radius: 12px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--text);
      color: var(--bg);
    }

    .list-container { flex: 1; overflow-y: auto; }
    .list-item { padding: 12px 0; border-bottom: 1px solid var(--glass-border); cursor: pointer; }

    #folder-input { display: none; }
  </style>
</head>
<body>

  <header>
    <button class="glass-btn icon-nav" onclick="toggleDrawer()">☰</button>
    <div style="display: flex; gap: 10px;">
      <button class="glass-btn icon-nav" onclick="document.getElementById('folder-input').click()">📁</button>
      <button class="glass-btn icon-nav" onclick="toggleTheme()">☯</button>
    </div>
  </header>

  <main class="main-player" id="swipe-area">
    <div class="album-frame">
      <img id="player-art" class="album-art" alt="Cover" />
      <div id="quote-container" class="quote-box">
        <div class="quote-text" id="quote-text">"Music is the soundtrack of your life."</div>
      </div>
    </div>

    <div class="track-meta">
      <div class="details">
        <div class="track-title" id="player-title">No Track Loaded</div>
        <div class="track-artist" id="player-artist">Tap 📁 to load local songs</div>
      </div>
    </div>

    <div class="progress-box">
      <input type="range" class="progress-bar" id="seek-bar" value="0" max="100" />
    </div>

    <div class="controls-row">
      <button class="glass-btn ctrl-btn" id="shuffle-btn" onclick="toggleShuffle()">🔀</button>
      <button class="glass-btn ctrl-btn" onclick="playPrev()">⏮</button>
      <button class="glass-btn ctrl-btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
      <button class="glass-btn ctrl-btn" onclick="playNext()">⏭</button>
      <button class="glass-btn ctrl-btn" id="repeat-btn" onclick="toggleRepeat()">🔁</button>
    </div>

    <div class="soundbars" id="soundbars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div>
    </div>
  </main>

  <div class="drawer-overlay" id="overlay" onclick="toggleDrawer()"></div>
  <div class="drawer" id="drawer">
    <h2>Library</h2>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="renderView('songs', this)">Songs</button>
      <button class="tab-btn" onclick="renderView('albums', this)">Albums</button>
      <button class="tab-btn" onclick="renderView('artists', this)">Artists</button>
    </div>
    <div class="list-container" id="list-container">
      <div style="font-size:12px; color:var(--subtext); padding-top:10px;">No offline songs saved yet.</div>
    </div>
  </div>

  <input type="file" id="folder-input" webkitdirectory directory multiple accept="audio/*" />
  <audio id="audio-player"></audio>

  <script>
    const quotes = [
      "\"Where words fail, music speaks.\"",
      "\"One good thing about music, when it hits you, you feel no pain.\"",
      "\"Turn your passion into power.\"",
      "\"Dream big, execute bigger.\"",
      "\"Music cleanses the soul from everyday life.\"",
      "\"Stay hungry, stay foolish.\"",
      "\"Your energy creates your reality.\""
    ];

    let playlist = [];
    let currentIndex = -1;
    let isShuffle = false;
    let isRepeat = false;

    const audio = document.getElementById('audio-player');
    const seekBar = document.getElementById('seek-bar');
    const soundbars = document.getElementById('soundbars');

    // Register Inline Service Worker for Offline Functionality
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'music-pwa-v1';
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./'])));
          self.skipWaiting();
        });
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // --- Persistent Audio Storage via IndexedDB ---
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('MusicStorageDB', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('tracks', { keyPath: 'id' });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveTrackToDB(track) {
      const db = await openDB();
      const tx = db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').put(track);
    }

    async function loadStoredTracks() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('tracks', 'readonly');
        const req = tx.objectStore('tracks').getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const savedTracks = await loadStoredTracks();
      if (savedTracks.length > 0) {
        playlist = savedTracks.map(t => ({
          ...t,
          url: URL.createObjectURL(t.blob)
        }));
        renderView('songs');
        loadTrack(0, false);
      }
    });

    document.getElementById('folder-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('audio/'));
      if (!files.length) return;

      playlist = [];
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const trackObj = {
          id: file.name + "_" + file.size,
          title: file.name.replace(/\.[^/.]+$/, ""),
          artist: "Unknown Artist",
          album: "Unknown Album",
          blob: file,
          art: null
        };
        
        await saveTrackToDB(trackObj);
        trackObj.url = URL.createObjectURL(file);
        playlist.push(trackObj);
      }

      renderView('songs');
      if (playlist.length) loadTrack(0, false);
    });

    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    }

    function renderView(type, btn) {
      if (btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }

      const container = document.getElementById('list-container');
      if (!playlist.length) return;

      if (type === 'songs') {
        container.innerHTML = playlist.map((t, i) => `
          <div class="list-item" onclick="loadTrack(${i}); toggleDrawer();">
            <div style="font-weight:600; font-size:14px;">${t.title}</div>
            <div style="font-size:12px; color:var(--subtext);">${t.artist}</div>
          </div>
        `).join('');
      } else {
        const key = type === 'albums' ? 'album' : 'artist';
        const groups = {};
        playlist.forEach(t => {
          const name = t[key] || `Unknown ${key}`;
          groups[name] = (groups[name] || 0) + 1;
        });

        container.innerHTML = Object.keys(groups).map(g => `
          <div class="list-item">
            <div style="font-weight:600; font-size:14px;">${g}</div>
            <div style="font-size:12px; color:var(--subtext);">${groups[g]} tracks</div>
          </div>
        `).join('');
      }
    }

    // Swipe gestures
    let touchStartX = 0;
    const swipeArea = document.getElementById('swipe-area');
    swipeArea.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
    swipeArea.addEventListener('touchend', e => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) playNext();
      if (touchEndX > touchStartX + 50) playPrev();
    });

    function loadTrack(index, autoPlay = true) {
      currentIndex = index;
      const track = playlist[currentIndex];
      audio.src = track.url;
      document.getElementById('player-title').innerText = track.title;
      document.getElementById('player-artist').innerText = track.artist;

      const artImg = document.getElementById('player-art');
      const quoteBox = document.getElementById('quote-container');

      if (track.art) {
        artImg.src = track.art;
        artImg.style.display = 'block';
        quoteBox.style.display = 'none';
      } else {
        artImg.style.display = 'none';
        quoteBox.style.display = 'flex';
        document.getElementById('quote-text').innerText = quotes[Math.floor(Math.random() * quotes.length)];
      }

      if (autoPlay) {
        audio.play();
        document.getElementById('play-btn').innerText = '⏸';
        soundbars.classList.add('playing');
      }
    }

    function togglePlay() {
      if (currentIndex === -1 && playlist.length) loadTrack(0);
      if (audio.paused) {
        audio.play();
        document.getElementById('play-btn').innerText = '⏸';
        soundbars.classList.add('playing');
      } else {
        audio.pause();
        document.getElementById('play-btn').innerText = '▶';
        soundbars.classList.remove('playing');
      }
    }

    function playNext() {
      if (!playlist.length) return;
      currentIndex = isShuffle ? Math.floor(Math.random() * playlist.length) : (currentIndex + 1) % playlist.length;
      loadTrack(currentIndex);
    }

    function playPrev() {
      if (!playlist.length) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex);
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      document.getElementById('shuffle-btn').style.opacity = isShuffle ? "1" : "0.4";
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      document.getElementById('repeat-btn').style.opacity = isRepeat ? "1" : "0.4";
    }

    audio.addEventListener('ended', () => {
      if (isRepeat) { audio.currentTime = 0; audio.play(); }
      else playNext();
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) seekBar.value = (audio.currentTime / audio.duration) * 100;
    });

    seekBar.addEventListener('input', () => {
      if (audio.duration) audio.currentTime = (seekBar.value / 100) * audio.duration;
    });
  </script>
</body>
</html>
