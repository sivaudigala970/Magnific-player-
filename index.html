<!DOCTYPE html>
<html lang="en" data-theme="dark" data-style="ios-glass" data-accent="purple">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Magnific Music Player</title>

  <!-- Restore saved appearance before first paint, to avoid a flash of defaults -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mp_theme');
        var s = localStorage.getItem('mp_style');
        var a = localStorage.getItem('mp_accent');
        if (t) document.documentElement.setAttribute('data-theme', t);
        if (s) document.documentElement.setAttribute('data-style', s);
        if (a) document.documentElement.setAttribute('data-accent', a);
      } catch (e) {}
    })();
  </script>

  <link rel="manifest" id="manifest-placeholder" />
  <meta name="theme-color" content="#0a0b0e" id="theme-color-meta" />

  <!-- iOS home-screen / standalone-app support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Magnific" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="color-scheme" content="dark light" />

  <!-- ID3 tags are parsed locally further down — no external library, so this loads and runs with zero network calls -->

  <style>
    :root {
      --bg: #0a0b0e;
      --card-bg: rgba(22, 24, 30, 0.82);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --subtext: #9a9ab0;
      --glass-btn: rgba(255, 255, 255, 0.08);
      --glass-btn-hover: rgba(255, 255, 255, 0.16);

      --accent-purple: #8b5cf6;
      --accent-crimson: #ff3b5c;
      --accent-emerald: #10b981;
      --accent-gold: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent: var(--accent-purple);

      --radius-card: 32px;
      --radius-art: 22px;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

      /* Neumorphic "elevated" surface used only for the settings dial */
      --neu-bg: #16171c;
      --neu-shadow: 7px 7px 16px rgba(0, 0, 0, 0.5), -6px -6px 14px rgba(255, 255, 255, 0.045);
      --neu-shadow-active: inset 4px 4px 8px rgba(0, 0, 0, 0.5), inset -3px -3px 6px rgba(255, 255, 255, 0.03);
    }

    [data-theme="light"] {
      --bg: #eef1f6;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(0, 0, 0, 0.08);
      --text: #111215;
      --subtext: #686b75;
      --glass-btn: rgba(0, 0, 0, 0.05);
      --glass-btn-hover: rgba(0, 0, 0, 0.12);

      --neu-bg: #eef1f6;
      --neu-shadow: 7px 7px 16px rgba(0, 0, 0, 0.14), -6px -6px 14px rgba(255, 255, 255, 0.95);
      --neu-shadow-active: inset 4px 4px 8px rgba(0, 0, 0, 0.12), inset -3px -3px 6px rgba(255, 255, 255, 0.9);
    }

    [data-accent="purple"] { --accent: var(--accent-purple); }
    [data-accent="crimson"] { --accent: var(--accent-crimson); }
    [data-accent="emerald"] { --accent: var(--accent-emerald); }
    [data-accent="gold"] { --accent: var(--accent-gold); }
    [data-accent="cyan"] { --accent: var(--accent-cyan); }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.3s ease, color 0.3s ease;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; z-index: 10; }
    .app-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }

    .glass-btn {
      background: var(--glass-btn);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      width: 44px;
      height: 44px;
      font-size: 18px;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .glass-btn:active { transform: scale(0.9); background: var(--glass-btn-hover); }

    .main-player { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 16px; touch-action: pan-y; }

    .player-card {
      width: 100%;
      max-width: 340px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-card);
      padding: 22px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transition: opacity 0.25s ease, transform 0.25s ease, background 0.3s ease, border-radius 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    [data-style="ios-glass"] .player-card { padding: 22px; }
    [data-style="ios-glass"] .album-frame { width: 100%; aspect-ratio: 1; border-radius: var(--radius-art); overflow: hidden; margin-bottom: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); }

    [data-style="minimal-dark"] .player-card { background: #000000; border: 1px solid #1f1f1f; border-radius: 36px; }
    [data-style="minimal-dark"] .album-frame { width: 100%; aspect-ratio: 1; border-radius: 24px; background: #111111; margin-bottom: 20px; }

    [data-style="spotify"] .player-card { background: transparent; border: none; box-shadow: none; backdrop-filter: none; }
    [data-style="spotify"] .album-frame { width: 100%; aspect-ratio: 1; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 16px 36px rgba(0,0,0,0.4); }

    [data-style="neumorphic"] .player-card { background: var(--bg); border: none; box-shadow: 12px 12px 24px rgba(0, 0, 0, 0.4), -8px -8px 18px rgba(255, 255, 255, 0.03); border-radius: 36px; }
    [data-style="neumorphic"] .album-frame { width: 100%; aspect-ratio: 1; border-radius: 24px; box-shadow: inset 4px 4px 8px rgba(0,0,0,0.5), inset -4px -4px 8px rgba(255,255,255,0.02); margin-bottom: 20px; }

    [data-style="cyber"] .player-card { background: rgba(10, 10, 18, 0.9); border: 2px solid var(--accent); box-shadow: 0 0 20px var(--accent); border-radius: 20px; }
    [data-style="cyber"] .album-frame { width: 100%; aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--accent); margin-bottom: 20px; }

    .album-art { width: 100%; height: 100%; object-fit: cover; display: none; }

    .quote-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0,0,0,0.15)); }
    .quote-text { font-size: 14px; font-weight: 600; font-style: italic; line-height: 1.4; }

    .track-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .track-title { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 13px; color: var(--subtext); margin-top: 2px; }

    .progress-box { margin-bottom: 16px; }
    .progress-bar { width: 100%; -webkit-appearance: none; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.15); outline: none; }
    .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 10px var(--accent); }

    .time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--subtext); margin-top: 6px; font-variant-numeric: tabular-nums; }

    .controls-row { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 8px; padding: 0 4px; }

    .ctrl-btn {
      background: var(--glass-btn);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      opacity: 0.7;
    }

    .ctrl-btn:active { transform: scale(0.88); }

    .ctrl-btn.active-glow { opacity: 1; border-color: var(--accent); color: var(--accent); box-shadow: 0 0 14px var(--accent); background: rgba(255, 255, 255, 0.12); }

    @keyframes fav-bounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.35) rotate(-8deg); }
      70% { transform: scale(0.92); }
      100% { transform: scale(1); }
    }

    .play-btn {
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--accent); color: #ffffff; border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; opacity: 1;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3), 0 0 15px var(--accent);
    }
    .play-btn:active { transform: scale(0.88) rotate(-3deg); }

    .soundbars { display: flex; align-items: flex-end; gap: 3px; height: 18px; justify-content: center; margin-top: 10px; }
    .bar { width: 3px; background: var(--accent); height: 4px; border-radius: 2px; transition: height 0.1s ease; }
    .soundbars.playing .bar { animation: pulse 0.6s infinite alternate ease-in-out; }
    .soundbars.playing .bar:nth-child(2n) { animation-delay: 0.2s; }
    .soundbars.playing .bar:nth-child(3n) { animation-delay: 0.4s; }
    @keyframes pulse { 0% { height: 4px; } 100% { height: 18px; } }

    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }

    .drawer-right {
      position: fixed; top: 0; right: -100%; width: 86%; max-width: 360px; height: 100%;
      background: var(--bg); border-left: 1px solid var(--card-border); z-index: 100;
      transition: right 0.3s ease; display: flex; flex-direction: column; padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
    }
    .drawer-right.open { right: 0; }

    .nav-tabs { display: flex; gap: 8px; margin: 16px 0; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 1; white-space: nowrap; text-align: center;
      background: var(--glass-btn); border: 1px solid var(--card-border);
      padding: 8px 12px; border-radius: 14px; color: var(--subtext);
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-btn:active { transform: scale(0.93); }
    .tab-btn.active { background: var(--accent); color: #ffffff; border-color: var(--accent); box-shadow: 0 0 16px var(--accent); }

    .list-container { flex: 1; overflow-y: auto; }

    @keyframes fade-slide-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .group-header { font-size: 13px; font-weight: 700; padding: 10px 0 4px 0; color: var(--accent); border-bottom: 1px solid var(--card-border); }

    .list-item {
      padding: 12px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
      animation: fade-slide-in 0.25s ease backwards;
      border-radius: 10px;
    }
    .list-item:active { background: var(--glass-btn-hover); transform: scale(0.98); }
    .list-item.now-playing { color: var(--accent); }

    .empty-hint { font-size: 12px; color: var(--subtext); padding-top: 10px; line-height: 1.6; }

    .file-import-box { display: flex; flex-direction: column; gap: 12px; padding-top: 10px; }

    .import-card {
      background: var(--glass-btn); border: 1px dashed var(--accent); border-radius: 16px;
      padding: 20px; text-align: center; cursor: pointer;
      transition: all 0.2s ease; animation: fade-slide-in 0.3s ease backwards;
    }
    .import-card:active { transform: scale(0.98); background: var(--glass-btn-hover); }
    .import-card h4 { font-size: 14px; color: var(--text); margin-bottom: 4px; }
    .import-card p { font-size: 11px; color: var(--subtext); }
    .import-card .fine-print { font-size: 10px; color: var(--subtext); opacity: 0.75; margin-top: 6px; }

    /* Pointer/mouse hover feedback (guarded so it doesn't stick on touch devices) */
    @media (hover: hover) and (pointer: fine) {
      .tab-btn:hover { background: var(--glass-btn-hover); color: var(--text); }
      .list-item:hover { background: var(--glass-btn-hover); }
      .import-card:hover { background: var(--glass-btn-hover); border-color: var(--accent); transform: translateY(-1px); }
      .ctrl-btn:hover { background: var(--glass-btn-hover); opacity: 0.9; }
      .glass-btn:hover { background: var(--glass-btn-hover); }
      .fab-mini:hover, .floating-settings-btn:hover, .strip-btn:hover { filter: brightness(1.08); }
    }

    /* ---------- Settings dial: floating button + 3 pop-out actions ---------- */
    .fab-dock {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: 20px;
      z-index: 130;
    }

    .floating-settings-btn {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 20px;
      background: var(--neu-bg);
      color: var(--accent);
      border: none;
      font-size: 22px;
      box-shadow: var(--neu-shadow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.32s var(--ease-spring), box-shadow 0.2s ease;
    }
    .floating-settings-btn:active { box-shadow: var(--neu-shadow-active); }
    .floating-settings-btn.open { transform: rotate(45deg); }

    .fab-mini {
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--neu-bg);
      border: 2px solid transparent;
      color: var(--text);
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--neu-shadow);
      opacity: 0;
      transform: scale(0.35);
      pointer-events: none;
      transition: transform 0.3s var(--ease-spring), opacity 0.22s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .fab-mini:active { box-shadow: var(--neu-shadow-active); }

    .fab-dock.open .fab-mini { opacity: 1; pointer-events: auto; }
    .fab-dock.open .fab-mini[data-order="1"] { transform: translateY(-64px) scale(1); transition-delay: 0.02s; }
    .fab-dock.open .fab-mini[data-order="2"] { transform: translateY(-128px) scale(1); transition-delay: 0.06s; }
    .fab-dock.open .fab-mini[data-order="3"] { transform: translateY(-192px) scale(1); transition-delay: 0.1s; }

    #color-mini { border-color: var(--accent); }

    .option-strip {
      position: absolute;
      right: 66px;
      height: 46px;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    #color-strip { bottom: 133px; }
    #template-strip { bottom: 197px; }

    .strip-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--neu-bg);
      box-shadow: var(--neu-shadow);
      border: 2px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      opacity: 0;
      transform: scale(0.3) translateX(16px);
      pointer-events: none;
      transition: transform 0.26s var(--ease-spring), opacity 0.2s ease, border-color 0.2s ease;
    }
    .option-strip.open .strip-btn { opacity: 1; transform: scale(1) translateX(0); pointer-events: auto; }
    .option-strip .strip-btn:nth-child(1) { transition-delay: 0.02s; }
    .option-strip .strip-btn:nth-child(2) { transition-delay: 0.06s; }
    .option-strip .strip-btn:nth-child(3) { transition-delay: 0.1s; }
    .option-strip .strip-btn:nth-child(4) { transition-delay: 0.14s; }
    .option-strip .strip-btn:nth-child(5) { transition-delay: 0.18s; }
    .strip-btn.selected { border-color: var(--text); }
    .strip-btn:active { transform: scale(0.85); }

    /* Toasts */
    .toast-container {
      position: fixed;
      bottom: calc(90px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      z-index: 200;
      pointer-events: none;
      width: 88%;
      max-width: 300px;
      align-items: center;
    }
    .toast {
      background: var(--neu-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 12.5px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      animation: toast-in 0.3s var(--ease-spring) forwards, toast-out 0.3s ease 2.6s forwards;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(12px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toast-out { to { opacity: 0; transform: translateY(-8px); } }

    #file-input, #folder-input { display: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">Magnific</div>
    <button class="glass-btn" onclick="toggleLibrary()" aria-label="Library">☰</button>
  </header>

  <main class="main-player" id="swipe-area">
    <div class="player-card">
      <div class="album-frame">
        <img id="player-art" class="album-art" alt="Cover" />
        <div id="quote-container" class="quote-box">
          <div class="quote-text" id="quote-text">"Where words fail, music speaks."</div>
        </div>
      </div>

      <div class="track-info">
        <div style="overflow: hidden; padding-right: 8px;">
          <div class="track-title" id="player-title">No Track Loaded</div>
          <div class="track-artist" id="player-artist">Tap ☰ to import music</div>
        </div>
        <button class="ctrl-btn" id="fav-btn" onclick="toggleFav()" aria-label="Favorite">☆</button>
      </div>

      <div class="progress-box">
        <input type="range" class="progress-bar" id="seek-bar" value="0" max="100" aria-label="Seek" />
        <div class="time-row">
          <span id="time-curr">0:00</span>
          <span id="time-dur">-0:00</span>
        </div>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn" id="shuffle-btn" onclick="toggleShuffle()" title="Shuffle">🔀</button>
        <button class="ctrl-btn" onclick="playPrev()" title="Previous">⏮</button>
        <button class="ctrl-btn play-btn" id="play-btn" onclick="togglePlay()" title="Play/Pause">▶</button>
        <button class="ctrl-btn" onclick="playNext()" title="Next">⏭</button>
        <button class="ctrl-btn" id="repeat-btn" onclick="toggleRepeat()" title="Repeat">🔁</button>
      </div>

      <div class="soundbars" id="soundbars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
    </div>
  </main>

  <div class="drawer-overlay" id="overlay" onclick="closeAllPanels()"></div>

  <div class="drawer-right" id="drawer-right">
    <h2>Library</h2>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="renderView('songs', this
